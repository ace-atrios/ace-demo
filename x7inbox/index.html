<script>

const dt=t=>new Date(t+':00-04:00');

const SL={REJECTED:'BAD ACCOUNT',VENDOR:'BOOKED W/ VENDOR',ALLAN:'BOOKED W/ ALLAN',WRONG:'WRONG NUMBER'};const sl=x=>SL[x]||x;const pl=t=>{const x=ST(t);return x=='VENDOR'&&t.vendor?'BOOKED W/ '+t.vendor.toUpperCase():sl(x)};const types=['All','OPEN','VENDOR','ALLAN','REJECTED','WRONG','GHOSTED','Text','Email','Vendor','Lead','Tastemaker','Partner'];const isSt=t=>['OPEN','VENDOR','ALLAN','REJECTED','WRONG','GHOSTED'].includes(t);

const EMRE=/^(?:\[Email([^\]]*)\]|\(email\)|Email((?: reply-all)?(?: \([^)]*\))?):)\s*/i;const isEm=(t,m)=>t.ch=='email'||EMRE.test(m.x);

 document.getElementById('mh').innerHTML=`<span class="back" onclick="document.getElementById('wrap').classList.remove('open')">‹ Back</span>${chLbl(t)=='Email'?'<span class="ch email">EMAIL</span>':chLbl(t)=='Text'?'<span class="ch text">TEXT</span>':'<span class="ch mix">TEXT + EMAIL</span>'}<h2 style="display:inline">${esc(t.name)}</h2>${(t.ppl||[]).length?`<div class="ppl">${t.ppl.map(([n,u])=>u?`<a href="${esc(u)}" target="_blank" rel="noopener"><span class="lib">in</span>${esc(n)}</a>`:`<span class="nol">${esc(n)} <i>(no LinkedIn found)</i></span>`).join("")}</div>`:""}<div class="meta">${t.type?`<span class="tag ${t.type}">${t.type}</span>`:''}${esc(t.co||'')}${' · '}<span class="sb ${ST(t)}">${pl(t)}</span>${t.by?'Intro by '+esc(t.by)+' → to '+esc(t.name):''}${t.stage?' · '+esc(t.stage):''} · ${t.msgs.length} messages${t.next?` · <b style="color:#b45309">Next follow-up: ${esc(t.next)}</b>`:''}</div>`;
 const EV=t.ch=='email'||(t.msgs.length&&t.msgs.every(m=>isEm(t,m)));const others=[...new Set(t.msgs.filter(m=>m.w!='Ace').map(m=>m.w))];const GRP=!EV&&(others.length>1||(t.ppl||[]).length>1);

 const sep=d=>{const n=new Date(),y=new Date(n-864e5);const tm=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});const lab=d.toDateString()==n.toDateString()?'Today':d.toDateString()==y.toDateString()?'Yesterday':d.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'});return `<div class="ts"><b>${lab}</b> ${tm}</div>`};

async function dec(B,code){try{const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]);const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(B.s),iterations:200000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(B.i)},key,b64(B.c))))}catch(e){return null}}

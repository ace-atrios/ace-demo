<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ace Inbox · Atrios</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Inter","Helvetica Neue",Arial,sans-serif;color:#1d1d1f;background:#f5f3ee;height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:14px;padding:12px 18px;background:#0e3b2e;color:#f5efe2}
header h1{font:600 17px Georgia,serif;margin:0}header .sub{opacity:.7;font-size:12px}
.wrap{flex:1;display:flex;min-height:0}
.side{width:360px;border-right:1px solid #e2ddd2;background:#fbfaf7;display:flex;flex-direction:column;min-height:0}
.search{padding:10px;border-bottom:1px solid #e9e4da}.search input{width:100%;padding:9px 12px;border:1px solid #d9d3c6;border-radius:10px;font-size:14px;background:#fff}
.filters{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid #e9e4da;flex-wrap:wrap}.fd{position:relative;display:inline-flex;align-items:center;gap:5px;border:1px solid #d9d3c6;background:#fff;border-radius:14px;padding:4px 10px;font-size:12px;cursor:pointer;color:#444}.fd.on{background:#0e3b2e;color:#fff;border-color:#0e3b2e}.fd select{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:16px}.fd .cv{font-size:10px;opacity:.7}
.filters button{border:1px solid #d9d3c6;background:#fff;border-radius:14px;padding:3px 10px;font-size:12px;cursor:pointer}.filters button.on{background:#0e3b2e;color:#fff;border-color:#0e3b2e}
.list{overflow:auto;flex:1}
.row{padding:11px 14px;border-bottom:1px solid #eee8dc;cursor:pointer}.row:hover{background:#f2efe7}.row.sel{background:#e6efe9}
.row .top{display:flex;justify-content:space-between;gap:8px}.row .nm{font-weight:600}.row .tm{color:#8a857a;font-size:12px;white-space:nowrap}
.row .co{color:#6b665c;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .pv{color:#555;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.tag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:9px;margin-right:4px;background:#efe9db;color:#5d5442}
.ch{display:inline-block;font:700 9.5px/1 Inter,Helvetica,Arial;letter-spacing:.06em;padding:3px 6px;border-radius:4px;margin-right:6px;vertical-align:1px}.ch.text{background:#e5f2e8;color:#22603a}.ch.email{background:#e3ecf7;color:#234b7a}.sb{display:inline-block;font:800 9.5px/1 Inter,Helvetica,Arial;letter-spacing:.08em;padding:3px 7px;border-radius:4px;margin-right:6px}.sb.OPEN{background:#e3ecf7;color:#234b7a}.sb.VENDOR{background:#d7efdd;color:#1f6b3a}.sb.WRONG{background:#fdebd3;color:#9a5a0c}.sb.ALLAN{background:#efe4fb;color:#5b2a9b}.sb.REJECTED{background:#fbe3e0;color:#9b2c1f}.sb.GHOSTED{background:#ececec;color:#666}.sb.CALLSET{background:#e6f4ea;color:#2a6b45}.row.s-CALLSET{box-shadow:inset 4px 0 #7cc196}.row.s-VENDOR{box-shadow:inset 4px 0 #2e8b4f}.row.s-WRONG{box-shadow:inset 4px 0 #e0952f}.row.s-ALLAN{box-shadow:inset 4px 0 #8a55d1}.row.s-REJECTED{box-shadow:inset 4px 0 #c0392b}.row.s-GHOSTED{box-shadow:inset 4px 0 #aaa}.row.s-OPEN{box-shadow:inset 4px 0 #3b6fb0}.nm .by{font-weight:500;color:#6b6b6b}.nm .ar{color:#aaa;margin:0 6px;font-weight:400}.co{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}.co .sb{margin-right:0}.co .cx{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}.chs{font:600 10px/1 Inter,Helvetica,Arial;color:#9a9a9a;text-transform:uppercase;letter-spacing:.06em}.intro{font:12px/1.3 Inter,Helvetica,Arial;color:#555;margin:3px 0}.intro b{color:#222}
.mk{display:inline-block;font:700 9.5px/1 Inter,Helvetica,Arial;letter-spacing:.04em;padding:3px 6px;border-radius:4px;margin-left:6px;background:#dff0e3;color:#1f6b3a}.st{display:inline-block;font:700 9.5px/1 Inter,Helvetica,Arial;padding:3px 6px;border-radius:4px;margin-left:6px;background:#fbe3e0;color:#9b2c1f}
.tag.Vendor{background:#e3ecf7;color:#234b7a}.tag.Lead{background:#f7e8e3;color:#7a3a23}.tag.Tastemaker{background:#e5f2e8;color:#22603a}.tag.Partner{background:#efe6f7;color:#57307a}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.mh{padding:14px 22px;border-bottom:1px solid #e2ddd2;background:#fff}.mh h2{margin:0 0 3px;font:600 19px Georgia,serif}.mh .meta{color:#6b665c;font-size:12.5px}
.msgs{flex:1;overflow:auto;padding:18px 22px;background:#f5f3ee}
.m{max-width:680px;margin:0 0 10px;display:flex;flex-direction:column}
.m .who{font-size:11.5px;color:#8a857a;margin:0 4px 2px}
.m .b{padding:9px 13px;border-radius:16px;background:#fff;border:1px solid #e6e0d4;white-space:pre-wrap;word-wrap:break-word}
.m.ace{margin-left:auto;align-items:flex-end}.m.ace .b{background:#0e3b2e;color:#f8f4ea;border-color:#0e3b2e}
.m.staff .b{background:#e9f0ea;border-color:#d3e1d6}
.day{text-align:center;color:#8a857a;font-size:12px;margin:14px 0 8px}
mark{background:#ffe58a;padding:0 1px;border-radius:2px}
.empty{color:#8a857a;padding:40px;text-align:center}
.back{display:none;margin-right:8px;cursor:pointer;color:#0e3b2e;font-weight:600}
@media(max-width:760px){.side{width:100%}.main{display:none}.wrap.open .side{display:none}.wrap.open .main{display:flex}.back{display:inline-block}}
.ppl{margin:6px 0 2px;display:flex;flex-wrap:wrap;gap:6px}.ppl a{display:inline-flex;align-items:center;gap:6px;font:600 13px/1 Inter,Helvetica,Arial;color:#0a66c2;background:#eef4fb;border:1px solid #cfe0f3;border-radius:999px;padding:5px 10px 5px 5px;text-decoration:none}.ppl a:hover{background:#e1ecf8}.ppl .lib{background:#0a66c2;color:#fff;font:800 10px/1 Arial;border-radius:3px;padding:3px 4px}.ppl .nol{font:600 13px/1 Inter,Helvetica,Arial;color:#444;padding:5px 2px}.ppl .nol i{font-weight:400;color:#999}.vt{margin-left:auto;display:flex;gap:4px}.vt button{border:1px solid #5d7d70;background:transparent;color:#f5efe2;border-radius:14px;padding:4px 12px;font-size:12.5px;cursor:pointer}.vt button.on{background:#f5efe2;color:#0e3b2e}
.pr{display:inline-block;font:800 9.5px/1 Inter,Helvetica,Arial;padding:3px 6px;border-radius:4px;margin-right:6px}.pr.p5{background:#fbe3e0;color:#9b2c1f}.pr.p4{background:#fdecd2;color:#8a4b0f}.pr.p3{background:#f3efc9;color:#6b5d10}.pr.p2,.pr.p1{background:#ececec;color:#666}
.sec{background:#fff;border:1px solid #e6e0d4;border-radius:12px;padding:12px 16px;margin:0 0 12px;max-width:820px}.sec h3{margin:0 0 8px;font:600 13px Inter,Helvetica,Arial;text-transform:uppercase;letter-spacing:.06em;color:#6b665c}
.it{padding:6px 0;border-top:1px solid #f0ebe1}.it:first-of-type{border-top:0}.it b{font-weight:600}.q{color:#6b665c;font-style:italic;font-size:12.5px;margin-top:2px}.lv{display:inline-block;font:700 10px/1 Inter;padding:3px 6px;border-radius:4px;margin-left:6px}.lv.on{background:#d7efdd;color:#1f6b3a}.lv.off{background:#efe6f7;color:#57307a}.snt{font-size:11px;margin-left:6px}.snt.negative{color:#b42318}.snt.positive{color:#1f6b3a}.fu{color:#b45309;font-weight:600}
.kpi{display:flex;gap:8px;padding:8px 10px;border-bottom:1px solid #e9e4da;background:#fff}.kpi div{flex:1;min-width:0;text-align:center;border:1px solid #eee8dc;border-radius:10px;padding:6px 4px}.kpi b{display:block;font:700 18px/1.1 Georgia,serif;color:#0e3b2e}.kpi span{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#8a857a}
</style></head><body><div id="gate" style="position:fixed;inset:0;background:#0e3b2e;display:flex;align-items:center;justify-content:center;z-index:9"><form id="gf" style="text-align:center;color:#f5efe2"><div style="font:600 22px Georgia,serif;margin-bottom:12px">Ace Inbox</div><input id="pc" type="password" inputmode="numeric" placeholder="Passcode" autocomplete="off" maxlength="6" style="padding:10px 14px;border-radius:10px;border:0;font-size:16px;width:180px;text-align:center"><br><button type="submit" style="margin-top:10px;padding:9px 22px;border-radius:10px;border:0;background:#f5efe2;color:#0e3b2e;font:600 15px system-ui">Open</button><div id="ge" style="margin-top:8px;font-size:12px;opacity:.8"></div></form></div>
<header><h1>Ace Inbox</h1><span class="sub">Every text + email thread Ace has with tastemakers, leads &amp; vendors · newest first · <span id="upd"></span></span><div class="vt"><button id="vT" class="on">Threads</button><button id="vI">Intent Signals</button></div></header>
<div class="wrap" id="wrap">
<div class="side"><div class="search"><input id="q" placeholder="Search names, companies, messages…" autofocus></div>
<div class="filters" id="f"></div><div class="kpi" id="kpi"></div><div class="list" id="list"></div></div>
<div class="main"><div class="mh" id="mh"><h2>Select a conversation</h2></div><div class="msgs" id="msgs"><div class="empty">Click a thread on the left to read it.</div></div></div>
</div>
<script>
let D=[];const STAFF=['Taylor','Allan','Will','Jordan','Shay'];
let q='',ft='All',sel=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hl=s=>{s=esc(s);if(!q)return s;const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');return s.replace(re,'<mark>$1</mark>')};
const dt=t=>new Date(t+':00-04:00');
const fmt=t=>{const d=dt(t);const now=new Date();return d.toDateString()===now.toDateString()?d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):d.toLocaleDateString([],{month:'short',day:'numeric'})};
const SL={VENDOR:'BOOKED W/ VENDOR',ALLAN:'BOOKED W/ ALLAN',WRONG:'WRONG NUMBER'};const sl=x=>SL[x]||x;const pl=t=>{const x=ST(t);return x=='VENDOR'&&t.vendor?'BOOKED W/ '+t.vendor.toUpperCase():sl(x)};const types=['All','OPEN','VENDOR','ALLAN','REJECTED','WRONG','GHOSTED','Text','Email','Vendor','Lead','Tastemaker','Partner'];const isSt=t=>['OPEN','VENDOR','ALLAN','REJECTED','WRONG','GHOSTED'].includes(t);
const isCh=t=>t=='Text'||t=='Email';const chOf=x=>x.ch=='email'?'Email':'Text';
const F=document.getElementById('f');
const G=[['Status','fs',['All','OPEN','VENDOR','ALLAN','REJECTED','WRONG','GHOSTED']],['Channel','fc',['All','Text','Email']],['Type','fty',['All','Vendor','Lead','Tastemaker','Partner']]];const FS={fs:'All',fc:'All',fty:'All'};
const okBy=(t,k,v)=>v=='All'||(k=='fs'?ST(t)==v:k=='fc'?chOf(t)==v:t.type==v);
function buildF(){F.innerHTML=G.map(([lab,k,opts])=>`<label class="fd ${FS[k]!='All'?'on':''}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg><span>${lab}${FS[k]!='All'?': '+sl(FS[k]):''}</span><select data-k="${k}">${opts.map(o=>`<option value="${o}" ${FS[k]==o?'selected':''}>${o=='All'?'All '+lab.toLowerCase():sl(o)} (${D.filter(x=>okBy(x,k,o)&&G.every(([,k2])=>k2==k||okBy(x,k2,FS[k2]))).length})</option>`).join('')}</select><span class="cv">▾</span></label>`).join('')}
F.onchange=e=>{const t=e.target;if(!t.dataset.k)return;FS[t.dataset.k]=t.value;buildF();render()};
const ST=t=>{const g=(t.stage||'').toLowerCase();if(t.status&&t.status!='OPEN')return t.status=='BOOKED'?'VENDOR':t.status;if(g.includes('call w/ allan')||g.includes('coffee w/ allan')||g.includes('call set'))return 'ALLAN';if(g.startsWith('booked'))return 'VENDOR';if(g.includes('declin')||g.includes('closed')||g.includes('reject'))return 'REJECTED';const last=t.msgs.length?new Date(t.msgs[t.msgs.length-1].t):new Date();if(Date.now()-last>2*864e5)return 'GHOSTED';return 'OPEN'};
function match(t){if(!G.every(([,k])=>okBy(t,k,FS[k])))return false;if(!q)return true;const s=q.toLowerCase();return (t.name+' '+t.co+' '+t.stage+' '+t.by+' '+ST(t)).toLowerCase().includes(s)||t.msgs.some(m=>(m.w+' '+m.x).toLowerCase().includes(s))}
const STF=['allan','will','jordan','taylor','gabe','kira','eliot','shay','osman','ace'];
function kpi(L){const nm=t=>(t.name||'').trim().toLowerCase();const P=new Set(L.map(nm).filter(Boolean));const PB=new Set();let B=0;L.forEach(t=>{if(ST(t)=='VENDOR'){PB.add(nm(t));B+=t.vendor?t.vendor.split(/,|\+|&/).filter(v=>v.trim()).length:1}});
document.getElementById('kpi').innerHTML=`<div><b>${P.size}</b><span>Unique people</span></div><div><b>${L.length}</b><span>Threads</span></div><div><b>${PB.size}</b><span>People booked</span></div><div><b>${B}</b><span>Total bookings</span></div>`}
function render(){const L=D.filter(match);kpi(L);const el=document.getElementById('list');
 if(!L.length){el.innerHTML='<div class="empty">No matches</div>';return}
 el.innerHTML=L.map(t=>{const last=t.msgs[t.msgs.length-1];let pv=last;if(q){const h=t.msgs.find(m=>m.x.toLowerCase().includes(q.toLowerCase()));if(h)pv=h}
  return `<div class="row ${sel==t.k?'sel':''} s-${ST(t)}" data-k="${t.k}"><div class="top"><span class="nm">${t.by?`<span class="by">${esc(t.by)}</span><span class="ar">→</span>`:''}${hl(t.name)}</span><span class="tm">${fmt(last.t)}</span></div>
  <div class="co"><span class="sb ${ST(t)}">${pl(t)}${(ST(t)=='VENDOR'||ST(t)=='ALLAN')&&t.mark?' · '+esc(t.mark.replace(/^.*(BOOKED|CALL SET) · /,'')):''}</span>${t.type?`<span class="tag ${t.type}">${t.type}</span>`:''}<span class="cx">${hl(t.co||'')}</span><span class="chs">${t.ch=='email'?'Email':'Text'}</span></div><div class="pv"><b>${esc(pv.w)}:</b> ${hl(pv.x.slice(0,140))}</div></div>`}).join('')}
document.getElementById('list').onclick=e=>{const r=e.target.closest('.row');if(!r)return;if(r.dataset.s!==undefined)sigOpen(+r.dataset.s);else openT(r.dataset.k)};
function openT(k){sel=k;const t=D.find(x=>x.k==k);render();document.getElementById('wrap').classList.add('open');
 document.getElementById('mh').innerHTML=`<span class="back" onclick="document.getElementById('wrap').classList.remove('open')">‹ Back</span>${t.ch=='email'?'<span class="ch email">EMAIL</span>':'<span class="ch text">TEXT</span>'}<h2 style="display:inline">${esc(t.name)}</h2>${(t.ppl||[]).length?`<div class="ppl">${t.ppl.map(([n,u])=>u?`<a href="${esc(u)}" target="_blank" rel="noopener"><span class="lib">in</span>${esc(n)}</a>`:`<span class="nol">${esc(n)} <i>(no LinkedIn found)</i></span>`).join("")}</div>`:""}<div class="meta">${t.type?`<span class="tag ${t.type}">${t.type}</span>`:''}${esc(t.co||'')}${' · '}<span class="sb ${ST(t)}">${pl(t)}</span>${t.by?'Intro by '+esc(t.by)+' → to '+esc(t.name):''}${t.stage?' · '+esc(t.stage):''} · ${t.msgs.length} messages${t.next?` · <b style="color:#b45309">Next follow-up: ${esc(t.next)}</b>`:''}</div>`;
 let day='',h='';for(const m of t.msgs){const d=dt(m.t).toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'});if(d!=day){day=d;h+=`<div class="day">${d}</div>`}
  const cls=m.w=='Ace'?'ace':(STAFF.includes(m.w)?'staff':'');h+=`<div class="m ${cls}"><div class="who">${esc(m.w)} · ${dt(m.t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</div><div class="b">${hl(m.x)}</div></div>`}
 const el=document.getElementById('msgs');el.innerHTML=h;
 const mk=el.querySelector('mark');if(mk)mk.scrollIntoView({block:'center'});else el.scrollTop=el.scrollHeight}
document.getElementById('q').oninput=e=>{q=e.target.value.trim();if(V=='I'){sigList();return}render();if(sel)openT(sel)};
let V='T',SIG=[],fi={cat:'All',src:'All',plat:'All'};
const fuOf=p=>(p.contracts||[]).map(c=>c.follow_up_by).filter(Boolean).sort()[0]||'';
const catsOf=p=>[...new Set((p.needs||[]).map(n=>n.category))];
function sigMatch(p){if(fi.src!='All'&&(fi.src=='Calls'?p.source!='call':p.source!='text'))return false;if(fi.plat!='All'){const on=(p.needs||[]).some(n=>n.live_vendor),off=(p.needs||[]).some(n=>!n.live_vendor);if(fi.plat=='On Atrios'&&!on)return false;if(fi.plat=='Off-platform'&&!off)return false;if(fi.plat=='Renewal dates'&&!(p.contracts||[]).length)return false}
 if(fi.cat!='All'&&!catsOf(p).includes(fi.cat))return false;if(!q)return true;return JSON.stringify(p).toLowerCase().includes(q.toLowerCase())}
function sigF(){const cats=['All',...[...new Set(SIG.flatMap(catsOf))].sort()];const g=[['Source','src',['All','Calls','Texts']],['Fit','plat',['All','On Atrios','Off-platform','Renewal dates']],['Need','cat',cats]];
 F.innerHTML=g.map(([lab,k,opts])=>`<label class="fd ${fi[k]!='All'?'on':''}"><span>${lab}${fi[k]!='All'?': '+fi[k]:''}</span><select data-s="${k}">${opts.map(o=>`<option ${fi[k]==o?'selected':''}>${o}</option>`).join('')}</select><span class="cv">▾</span></label>`).join('')}
function sigList(){const L=SIG.filter(sigMatch).sort((a,b)=>(b.priority-a.priority)||((fuOf(a)||'9')<(fuOf(b)||'9')?-1:1));const el=document.getElementById('list');
 el.innerHTML=L.length?L.map((p,i)=>`<div class="row ${sel=='s'+SIG.indexOf(p)?'sel':''}" data-s="${SIG.indexOf(p)}"><div class="top"><span class="nm"><span class="pr p${p.priority}">P${p.priority}</span>${hl(p.name)}</span><span class="tm">${p.source=='call'?'Call':'Text'} · ${esc(p.date.slice(5))}</span></div><div class="co"><span class="cx">${hl(p.company||'')}${p.vendor?' · w/ '+esc(p.vendor):''}</span></div><div class="pv">${fuOf(p)?`<span class="fu">Follow up by ${esc(fuOf(p))} · </span>`:''}${hl((p.next_action||p.summary||'').slice(0,140))}</div></div>`).join(''):'<div class="empty">No signals</div>'}
function sigOpen(i){sel='s'+i;const p=SIG[i];sigList();document.getElementById('wrap').classList.add('open');
 document.getElementById('mh').innerHTML=`<span class="back" onclick="document.getElementById('wrap').classList.remove('open')">‹ Back</span><span class="pr p${p.priority}">P${p.priority}</span><h2 style="display:inline">${esc(p.name)}</h2><div class="meta">${esc(p.company||'')}${p.role?' · '+esc(p.role):''} · from ${p.source=='call'?'call with '+esc(p.vendor||'vendor'):'Ace thread'} on ${esc(p.date)}${p.tm?' · tastemaker '+esc(p.tm):''}${p.inbox_key?` · <a href="#" onclick="V='T';setV();openT('${p.inbox_key}');return false">open thread</a>`:''}</div>`;
 const sec=(t,a,f)=>a&&a.length?`<div class="sec"><h3>${t}</h3>${a.map(x=>`<div class="it">${f(x)}${x.quote?`<div class="q">“${esc(x.quote)}”</div>`:''}</div>`).join('')}</div>`:'';
 document.getElementById('msgs').innerHTML=`<div class="sec"><h3>Summary</h3>${esc(p.summary||'')}${p.next_action?`<div style="margin-top:8px"><b>Next:</b> ${esc(p.next_action)}</div>`:''}</div>`+
  sec('Renewals & contract dates',p.contracts,c=>`<b>${esc(c.tool)}</b>: ${esc(c.detail||'')}${c.renewal_or_end?' · ends '+esc(c.renewal_or_end):''}${c.follow_up_by?` · <span class="fu">follow up by ${esc(c.follow_up_by)}</span>`:''}`)+
  sec('Needs',p.needs,n=>`<b>${esc(n.category)}</b>: ${esc(n.detail||'')}${n.urgency?' · '+esc(n.urgency):''}${n.live_vendor?`<span class="lv on">On Atrios: ${esc(n.live_vendor)}</span>`:'<span class="lv off">Off-platform → find vendor</span>'}`)+
  sec('Triggers',p.triggers,t=>`<b>${esc(t.type.replace('_',' '))}</b>: ${esc(t.detail||'')}${t.when?' · '+esc(t.when):''}`)+
  sec('Current stack',p.stack,s=>`<b>${esc(s.tool)}</b> <span style="color:#8a857a">(${esc(s.category||'')})</span>${s.sentiment?`<span class="snt ${s.sentiment}">${s.sentiment}</span>`:''}`)+
  sec('Peer / sentiment signals',p.peer_signals,s=>`<b>${esc(s.tool)}</b>: ${esc(s.opinion||'')}`);
 document.getElementById('msgs').scrollTop=0}
function setV(){document.getElementById('kpi').style.display=V=='I'?'none':'flex';document.getElementById('vT').classList.toggle('on',V=='T');document.getElementById('vI').classList.toggle('on',V=='I');sel=null;document.getElementById('mh').innerHTML='<h2>'+(V=='I'?'Select a lead':'Select a conversation')+'</h2>';document.getElementById('msgs').innerHTML='<div class="empty">'+(V=='I'?'Pick a lead on the left to see their intent profile.':'Click a thread on the left to read it.')+'</div>';if(V=='I'){sigF();sigList()}else{buildF();render()}}
document.getElementById('vT').onclick=()=>{V='T';setV()};document.getElementById('vI').onclick=()=>{V='I';setV()};
F.addEventListener('change',e=>{const k=e.target.dataset.s;if(!k)return;fi[k]=e.target.value;sigF();sigList()});


const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dec(B,code){try{const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]);const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(B.s),iterations:200000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(B.i)},key,b64(B.c))))}catch(e){return null}}
let CODE=localStorage.getItem('aceinbox_pc'),VER='';
async function load(first){try{const r=await fetch('data.json?v='+Date.now(),{cache:'no-store'});const B=await r.json();if(B.v===VER&&!first)return;const d=await dec(B,CODE);if(!d){if(first){localStorage.removeItem('aceinbox_pc');document.getElementById('gate').style.display='flex'}return}
 VER=B.v;D=d.threads;SIG=d.signals||[];document.getElementById('upd').textContent='updated '+new Date(d.gen).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});document.getElementById('gate').style.display='none';if(V=='I'){sigF();sigList()}else{buildF();render();if(sel)openT(sel)}}catch(e){}}

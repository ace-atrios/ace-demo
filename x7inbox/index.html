<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ace Inbox · Atrios</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Inter","Helvetica Neue",Arial,sans-serif;color:#1d1d1f;background:#f5f3ee;height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:14px;padding:12px 18px;background:#0e3b2e;color:#f5efe2}
header h1{font:600 17px Georgia,serif;margin:0}header .sub{opacity:.7;font-size:12px}
.wrap{flex:1;display:flex;min-height:0}
.side{width:360px;border-right:1px solid #e2ddd2;background:#fbfaf7;display:flex;flex-direction:column;min-height:0}
.search{padding:10px;border-bottom:1px solid #e9e4da}.search input{width:100%;padding:9px 12px;border:1px solid #d9d3c6;border-radius:10px;font-size:14px;background:#fff}
.filters{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid #e9e4da;flex-wrap:wrap}
.filters button{border:1px solid #d9d3c6;background:#fff;border-radius:14px;padding:3px 10px;font-size:12px;cursor:pointer}.filters button.on{background:#0e3b2e;color:#fff;border-color:#0e3b2e}
.list{overflow:auto;flex:1}
.row{padding:11px 14px;border-bottom:1px solid #eee8dc;cursor:pointer}.row:hover{background:#f2efe7}.row.sel{background:#e6efe9}
.row .top{display:flex;justify-content:space-between;gap:8px}.row .nm{font-weight:600}.row .tm{color:#8a857a;font-size:12px;white-space:nowrap}
.row .co{color:#6b665c;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .pv{color:#555;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.tag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:9px;margin-right:4px;background:#efe9db;color:#5d5442}
.ch{display:inline-block;font:700 9.5px/1 Inter,Helvetica,Arial;letter-spacing:.06em;padding:3px 6px;border-radius:4px;margin-right:6px;vertical-align:1px}.ch.text{background:#e5f2e8;color:#22603a}.ch.email{background:#e3ecf7;color:#234b7a}.sb{display:inline-block;font:800 9.5px/1 Inter,Helvetica,Arial;letter-spacing:.08em;padding:3px 7px;border-radius:4px;margin-right:6px}.sb.OPEN{background:#e3ecf7;color:#234b7a}.sb.BOOKED{background:#d7efdd;color:#1f6b3a}.sb.REJECTED{background:#fbe3e0;color:#9b2c1f}.sb.GHOSTED{background:#ececec;color:#666}.sb.CALLSET{background:#e6f4ea;color:#2a6b45}.row.s-CALLSET{box-shadow:inset 4px 0 #7cc196}.row.s-BOOKED{box-shadow:inset 4px 0 #2e8b4f}.row.s-REJECTED{box-shadow:inset 4px 0 #c0392b}.row.s-GHOSTED{box-shadow:inset 4px 0 #aaa}.row.s-OPEN{box-shadow:inset 4px 0 #3b6fb0}.nm .by{font-weight:500;color:#6b6b6b}.nm .ar{color:#aaa;margin:0 6px;font-weight:400}.co{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}.co .sb{margin-right:0}.co .cx{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}.chs{font:600 10px/1 Inter,Helvetica,Arial;color:#9a9a9a;text-transform:uppercase;letter-spacing:.06em}.intro{font:12px/1.3 Inter,Helvetica,Arial;color:#555;margin:3px 0}.intro b{color:#222}
.mk{display:inline-block;font:700 9.5px/1 Inter,Helvetica,Arial;letter-spacing:.04em;padding:3px 6px;border-radius:4px;margin-left:6px;background:#dff0e3;color:#1f6b3a}.st{display:inline-block;font:700 9.5px/1 Inter,Helvetica,Arial;padding:3px 6px;border-radius:4px;margin-left:6px;background:#fbe3e0;color:#9b2c1f}
.tag.Vendor{background:#e3ecf7;color:#234b7a}.tag.Lead{background:#f7e8e3;color:#7a3a23}.tag.Tastemaker{background:#e5f2e8;color:#22603a}.tag.Partner{background:#efe6f7;color:#57307a}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.mh{padding:14px 22px;border-bottom:1px solid #e2ddd2;background:#fff}.mh h2{margin:0 0 3px;font:600 19px Georgia,serif}.mh .meta{color:#6b665c;font-size:12.5px}
.msgs{flex:1;overflow:auto;padding:18px 22px;background:#f5f3ee}
.m{max-width:680px;margin:0 0 10px;display:flex;flex-direction:column}
.m .who{font-size:11.5px;color:#8a857a;margin:0 4px 2px}
.m .b{padding:9px 13px;border-radius:16px;background:#fff;border:1px solid #e6e0d4;white-space:pre-wrap;word-wrap:break-word}
.m.ace{margin-left:auto;align-items:flex-end}.m.ace .b{background:#0e3b2e;color:#f8f4ea;border-color:#0e3b2e}
.m.staff .b{background:#e9f0ea;border-color:#d3e1d6}
.day{text-align:center;color:#8a857a;font-size:12px;margin:14px 0 8px}
mark{background:#ffe58a;padding:0 1px;border-radius:2px}
.empty{color:#8a857a;padding:40px;text-align:center}
.back{display:none;margin-right:8px;cursor:pointer;color:#0e3b2e;font-weight:600}
@media(max-width:760px){.side{width:100%}.main{display:none}.wrap.open .side{display:none}.wrap.open .main{display:flex}.back{display:inline-block}}
</style></head><body><div id="gate" style="position:fixed;inset:0;background:#0e3b2e;display:flex;align-items:center;justify-content:center;z-index:9"><form id="gf" style="text-align:center;color:#f5efe2"><div style="font:600 22px Georgia,serif;margin-bottom:12px">Ace Inbox</div><input id="pc" type="password" inputmode="numeric" placeholder="Passcode" style="padding:10px 14px;border-radius:10px;border:0;font-size:16px;width:180px;text-align:center"><div id="ge" style="margin-top:8px;font-size:12px;opacity:.8"></div></form></div>
<header><h1>Ace Inbox</h1><span class="sub">Every text + email thread Ace has with tastemakers, leads &amp; vendors · newest first · <span id="upd"></span></span></header>
<div class="wrap" id="wrap">
<div class="side"><div class="search"><input id="q" placeholder="Search names, companies, messages…" autofocus></div>
<div class="filters" id="f"></div><div class="list" id="list"></div></div>
<div class="main"><div class="mh" id="mh"><h2>Select a conversation</h2></div><div class="msgs" id="msgs"><div class="empty">Click a thread on the left to read it.</div></div></div>
</div>
<script>
let D=[];const STAFF=['Taylor','Allan','Will','Jordan','Shay'];
let q='',ft='All',sel=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hl=s=>{s=esc(s);if(!q)return s;const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');return s.replace(re,'<mark>$1</mark>')};
const dt=t=>new Date(t+':00-04:00');
const fmt=t=>{const d=dt(t);const now=new Date();return d.toDateString()===now.toDateString()?d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):d.toLocaleDateString([],{month:'short',day:'numeric'})};
const types=['All','OPEN','BOOKED','CALLSET','REJECTED','GHOSTED','Text','Email','Vendor','Lead','Tastemaker','Partner'];const isSt=t=>['OPEN','BOOKED','CALLSET','REJECTED','GHOSTED'].includes(t);
const isCh=t=>t=='Text'||t=='Email';const chOf=x=>x.ch=='email'?'Email':'Text';
const F=document.getElementById('f');
function buildF(){F.innerHTML=types.map(t=>`<button data-t="${t}" class="${t==ft?'on':''}">${t=='CALLSET'?'CALL SET':t} <span style="opacity:.6">${t=='All'?D.length:D.filter(x=>isSt(t)?ST(x)==t:isCh(t)?chOf(x)==t:x.type==t).length}</span></button>`).join('')}
F.onclick=e=>{const b=e.target.closest('button');if(!b)return;ft=b.dataset.t;[...F.children].forEach(x=>x.classList.toggle('on',x.dataset.t==ft));render()};
const ST=t=>{const g=(t.stage||'').toLowerCase();if(t.status&&t.status!='OPEN')return t.status;if(g.includes('book'))return 'BOOKED';if(g.includes('call w/')||g.includes('call set'))return 'CALLSET';if(g.includes('declin')||g.includes('closed')||g.includes('reject'))return 'REJECTED';const last=t.msgs.length?new Date(t.msgs[t.msgs.length-1].t):new Date();if(Date.now()-last>2*864e5)return 'GHOSTED';return 'OPEN'};
function match(t){if(ft!='All'&&(isSt(ft)?ST(t)!=ft:isCh(ft)?chOf(t)!=ft:t.type!=ft))return false;if(!q)return true;const s=q.toLowerCase();return (t.name+' '+t.co+' '+t.stage+' '+t.by+' '+ST(t)).toLowerCase().includes(s)||t.msgs.some(m=>(m.w+' '+m.x).toLowerCase().includes(s))}
function render(){const L=D.filter(match);const el=document.getElementById('list');
 if(!L.length){el.innerHTML='<div class="empty">No matches</div>';return}
 el.innerHTML=L.map(t=>{const last=t.msgs[t.msgs.length-1];let pv=last;if(q){const h=t.msgs.find(m=>m.x.toLowerCase().includes(q.toLowerCase()));if(h)pv=h}
  return `<div class="row ${sel==t.k?'sel':''} s-${ST(t)}" data-k="${t.k}"><div class="top"><span class="nm">${t.by?`<span class="by">${esc(t.by)}</span><span class="ar">→</span>`:''}${hl(t.name)}</span><span class="tm">${fmt(last.t)}</span></div>
  <div class="co"><span class="sb ${ST(t)}">${ST(t)=='CALLSET'?'CALL SET':ST(t)}${(ST(t)=='BOOKED'||ST(t)=='CALLSET')&&t.mark?' · '+esc(t.mark.replace(/^.*(BOOKED|CALL SET) · /,'')):''}</span>${t.type?`<span class="tag ${t.type}">${t.type}</span>`:''}<span class="cx">${hl(t.co||'')}</span><span class="chs">${t.ch=='email'?'Email':'Text'}</span></div><div class="pv"><b>${esc(pv.w)}:</b> ${hl(pv.x.slice(0,140))}</div></div>`}).join('')}
document.getElementById('list').onclick=e=>{const r=e.target.closest('.row');if(r)openT(r.dataset.k)};
function openT(k){sel=k;const t=D.find(x=>x.k==k);render();document.getElementById('wrap').classList.add('open');
 document.getElementById('mh').innerHTML=`<span class="back" onclick="document.getElementById('wrap').classList.remove('open')">‹ Back</span>${t.ch=='email'?'<span class="ch email">EMAIL</span>':'<span class="ch text">TEXT</span>'}<h2 style="display:inline">${esc(t.name)}</h2><div class="meta">${t.type?`<span class="tag ${t.type}">${t.type}</span>`:''}${esc(t.co||'')}${' · '}<span class="sb ${ST(t)}">${ST(t)}</span>${t.by?'Intro by '+esc(t.by)+' → to '+esc(t.name):''}${t.stage?' · '+esc(t.stage):''} · ${t.msgs.length} messages</div>`;
 let day='',h='';for(const m of t.msgs){const d=dt(m.t).toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'});if(d!=day){day=d;h+=`<div class="day">${d}</div>`}
  const cls=m.w=='Ace'?'ace':(STAFF.includes(m.w)?'staff':'');h+=`<div class="m ${cls}"><div class="who">${esc(m.w)} · ${dt(m.t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</div><div class="b">${hl(m.x)}</div></div>`}
 const el=document.getElementById('msgs');el.innerHTML=h;
 const mk=el.querySelector('mark');if(mk)mk.scrollIntoView({block:'center'});else el.scrollTop=el.scrollHeight}
document.getElementById('q').oninput=e=>{q=e.target.value.trim();render();if(sel)openT(sel)};

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dec(B,code){try{const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]);const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(B.s),iterations:200000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(B.i)},key,b64(B.c))))}catch(e){return null}}
let CODE=localStorage.getItem('aceinbox_pc'),VER='';
async function load(first){try{const r=await fetch('data.json?v='+Date.now(),{cache:'no-store'});const B=await r.json();if(B.v===VER&&!first)return;const d=await dec(B,CODE);if(!d){if(first){localStorage.removeItem('aceinbox_pc');document.getElementById('gate').style.display='flex'}return}
 VER=B.v;D=d.threads;document.getElementById('upd').textContent='updated '+new Date(d.gen).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});document.getElementById('gate').style.display='none';buildF();render();if(sel)openT(sel)}catch(e){}}
document.getElementById('gf').onsubmit=async e=>{e.preventDefault();CODE=document.getElementById('pc').value.trim();const r=await fetch('data.json?v='+Date.now());const d=await dec(await r.json(),CODE);if(!d){document.getElementById('ge').textContent='Wrong passcode';return}localStorage.setItem('aceinbox_pc',CODE);load(true)};
if(CODE)load(true);
setInterval(()=>CODE&&load(false),60000);
</script></body></html>

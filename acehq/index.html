<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ace HQ · Atrios</title><link rel="icon" href="logo-A.png">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<style>
@font-face{font-family:Aspekta;src:url(AspektaVF.woff2) format("woff2");font-weight:100 900}
:root{--forest:#1A4D36;--deep:#0E2723;--gold:#C9A96E;--sgold:#FBE8A6;--cream:#FCF7E9;--lcream:#FFF4DE;--em:#609D77;--body:#4A4A4A;--muted:#848182;--card:#FEFEFE;--line:#E8E2D4;--red:#A43D20}
*{box-sizing:border-box}body{margin:0;font-family:Aspekta,Inter,system-ui,sans-serif;background:var(--cream);color:var(--body);font-size:14px}
a{color:var(--forest)}
#gate{position:fixed;inset:0;background:var(--deep);display:flex;align-items:center;justify-content:center;z-index:9}
#gate form{background:var(--cream);padding:32px;border-radius:16px;text-align:center;width:320px}
#gate input{font-size:22px;letter-spacing:6px;text-align:center;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;margin:14px 0}
button,.btn{font-family:inherit;background:var(--forest);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--forest);border:1px solid var(--line)}
header{display:flex;align-items:center;gap:16px;padding:14px 24px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header img{height:22px}header h1{font-size:17px;color:var(--forest);margin:0;font-weight:700}
header .sp{flex:1}header .upd{color:var(--muted);font-size:12px}
#search{border:1px solid var(--line);border-radius:10px;padding:8px 12px;width:260px;font-family:inherit;background:var(--cream)}
.wrap{display:flex;min-height:calc(100vh - 58px)}
nav{width:220px;padding:18px 12px;border-right:1px solid var(--line);background:var(--lcream);flex-shrink:0}
nav a{display:block;padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--body);font-weight:500;margin-bottom:2px}
nav a.on{background:var(--forest);color:#fff}nav .lab{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 12px 6px}
nav .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px}
main{flex:1;padding:24px 28px;max-width:1200px;overflow:auto}
h2{color:var(--forest);font-size:24px;margin:0 0 6px}h3{color:var(--forest);font-size:16px;margin:18px 0 8px}
.sub{color:var(--muted);margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h4{margin:0 0 6px;color:var(--forest);font-size:15px}.meta{color:var(--muted);font-size:12px;margin-bottom:8px}
.card ol,.card ul{margin:6px 0 0 18px;padding:0}.card li{margin:3px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:16px 0 22px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.kpi b{display:block;font-size:28px;color:var(--forest)}.kpi span{color:var(--muted);font-size:12px}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600;background:var(--lcream);color:var(--forest);border:1px solid var(--line);margin:2px 4px 2px 0}
.pill.gold{background:var(--sgold);border-color:var(--gold)}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden}
td,th{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:12px;color:var(--muted);font-weight:600;background:var(--lcream)}
.md{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 22px;line-height:1.55;overflow:auto}
.md h1,.md h2{font-size:18px}.md code{background:var(--lcream);padding:1px 5px;border-radius:5px;font-size:12px}
.md pre{background:var(--lcream);padding:10px;border-radius:8px;overflow:auto}
details{margin:8px 0}summary{cursor:pointer;font-weight:600;color:var(--forest)}
.teach{background:var(--deep);color:var(--cream);border-radius:14px;padding:16px;margin:18px 0}
.teach textarea{width:100%;min-height:70px;border-radius:10px;border:0;padding:10px;font-family:inherit;margin:8px 0}
.teach button{background:var(--gold);color:var(--deep)}
.teach .ok{color:var(--sgold);font-size:12px;margin-left:8px}
#graph{background:var(--card);border:1px solid var(--line);border-radius:14px;height:640px}
iframe{width:100%;height:calc(100vh - 140px);border:1px solid var(--line);border-radius:14px;background:#fff}
@media(max-width:800px){nav{display:none}#search{width:140px}}
</style></head><body>
<div id="gate"><form id="gf"><img src="logo-dark.svg" style="height:26px"><h3>Ace HQ</h3><div class="sub">Internal. Same passcode as the Ace Inbox.</div><input id="pc" inputmode="numeric" maxlength="6" autocomplete="off"><button>Open</button><div id="ge" style="color:var(--red);margin-top:8px"></div></form></div>
<header><img src="logo-dark.svg"><h1>Ace HQ</h1><input id="search" placeholder="Search everything Ace knows…"><div class="sp"></div><span class="upd" id="upd"></span><button class="btn ghost" id="refresh">↻ Refresh</button></header>
<div class="wrap"><nav id="nav"></nav><main id="main"></main></div>
<script>
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dec(B,code){try{const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]);const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(B.s),iterations:200000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(B.i)},key,b64(B.c))))}catch(e){return null}}
let CODE=localStorage.getItem('aceinbox_pc'),D=null,VIEW=location.hash.slice(1)||'overview';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){const r=await fetch('data.json?v='+Date.now(),{cache:'no-store'});const B=await r.json();const d=await dec(B,CODE);if(!d){localStorage.removeItem('aceinbox_pc');document.getElementById('gate').style.display='flex';return false}D=d;document.getElementById('gate').style.display='none';document.getElementById('upd').textContent='Updated '+new Date(D.gen).toLocaleString();render();return true}
document.getElementById('gf').onsubmit=async e=>{e.preventDefault();CODE=document.getElementById('pc').value.trim();if(!(await load()))document.getElementById('ge').textContent='Wrong passcode';else localStorage.setItem('aceinbox_pc',CODE)};
document.getElementById('pc').oninput=e=>{if(e.target.value.length===6)document.getElementById('gf').requestSubmit()};
document.getElementById('refresh').onclick=async()=>{const b=document.getElementById('refresh');b.textContent='Refreshing…';await load();b.textContent='↻ Refresh'};
window.onhashchange=()=>{VIEW=location.hash.slice(1)||'overview';render()};
document.getElementById('search').oninput=e=>{VIEW=e.target.value.trim()?'search':'overview';render()};
const FN=()=>D.k.functions,fname=id=>id==='company'?'Company':((FN().find(f=>f.id===id)||{}).name||id),fcol=id=>(FN().find(f=>f.id===id)||{}).color||'#848182';
function navHTML(){let h=[['overview','Overview'],['map','Knowledge map']].map(([k,l])=>`<a href="#${k}" class="${VIEW===k?'on':''}">${l}</a>`).join('');
h+='<div class="lab">Functions</div>'+FN().map(f=>`<a href="#fn-${f.id}" class="${VIEW==='fn-'+f.id?'on':''}"><span class="dot" style="background:${f.color}"></span>${f.name}</a>`).join('');
h+='<div class="lab">Everything Ace knows</div>'+[['rules','Rules'],['workflows','Workflows'],['vendors','Vendors'],['memory','Memory notes'],['skills','Skills'],['docs','Playbooks & docs']].map(([k,l])=>`<a href="#${k}" class="${VIEW===k?'on':''}">${l}</a>`).join('');
h+='<div class="lab">Live</div>'+[['inbox','Ace Inbox'],['signals','Intent signals'],['teach','Teach log'],['changelog','Changelog']].map(([k,l])=>`<a href="#${k}" class="${VIEW===k?'on':''}">${l}</a>`).join('');return h}
function teachBox(cat){return `<div class="teach"><b>Teach Ace · ${esc(cat)}</b><div style="font-size:12px;opacity:.8">New rule, correction or context. It goes to Ace tagged with this category. Ace files it and it shows up here on the next update.</div><textarea id="tt" placeholder="e.g. Never pitch Rho to cannabis companies (Shay)"></textarea><button onclick="teach('${esc(cat)}')">Send to Ace</button><span class="ok" id="tok"></span></div>`}
window.teach=cat=>{const t=document.getElementById('tt').value.trim();if(!t)return;location.href=`mailto:ace@atrios.com?subject=${encodeURIComponent('[Teach Ace] '+cat)}&body=${encodeURIComponent(t+'\n\n(sent from Ace HQ, '+cat+')')}`;document.getElementById('tok').textContent='Opening your email… Ace files it within the hour.'};
function wfCard(w){return `<div class="card"><h4>${esc(w.name)}</h4><div class="meta"><span class="pill" style="color:#fff;background:${fcol(w.fn)};border-color:${fcol(w.fn)}">${fname(w.fn)}</span>${w.schedule?`<span class="pill gold">${esc(w.schedule)}</span>`:''} Owner: ${esc(w.owner)}</div><div><b>When:</b> ${esc(w.trigger)}</div><ol>${w.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>${w.sources.length?`<div class="meta" style="margin-top:8px">Source: ${w.sources.map(esc).join(', ')}</div>`:''}</div>`}
function rulesHTML(gs){return gs.map(g=>`<h3>${esc(g.name)} <span class="pill">${fname(g.fn)}</span></h3><table><tr><th>Rule</th><th style="width:140px">Set by</th><th style="width:80px">Date</th></tr>${g.rules.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}</table>`).join('')}
function vendorCard(v){return `<div class="card"><h4>${esc(v.name)}</h4>${v.terms?`<div class="meta">${esc(v.terms)}</div>`:''}${v.fit?`<div><b>Fit:</b> ${esc(v.fit)}</div>`:''}${v.anti?`<div><b>Not a fit:</b> ${esc(v.anti)}</div>`:''}${(v.triggers||[]).length?`<div style="margin-top:6px"><b>Triggers</b><ul>${v.triggers.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>`:''}${(v.gates||[]).length?`<details><summary>Intake gates (${v.gates.length})</summary><ul>${v.gates.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></details>`:''}${(v.perks||[]).length?`<div style="margin-top:6px">${v.perks.map(p=>`<span class="pill gold">${esc(typeof p==='string'?p:(p.title||JSON.stringify(p)))}</span>`).join('')}</div>`:''}</div>`}
function memList(l){return `<table><tr><th style="width:50px">#</th><th>Note</th><th style="width:110px">Function</th></tr>${l.map(m=>`<tr><td>${m.id}</td><td><b>${esc(m.title)}</b><div class="meta">${esc(m.summary)}</div></td><td>${fname(m.fn)}</td></tr>`).join('')}</table>`}
function docList(l){return l.map(d=>`<details class="card" style="margin-bottom:10px"><summary>${esc(d.title||d.name)} <span class="pill">${esc(d.kind||'Skill')}</span><span class="pill">${fname(d.fn)}</span></summary>${d.desc?`<div class="meta" style="margin-top:6px">${esc(d.desc)}</div>`:''}<div class="md" style="margin-top:10px">${marked.parse(d.md)}</div></details>`).join('')}
</script>
<script>
function render(){if(!D)return;document.getElementById('nav').innerHTML=navHTML();const m=document.getElementById('main'),K=D.k,S=D.stats;let h='';
if(VIEW==='overview'){h=`<h2>Ace HQ</h2><div class="sub">${esc(K.about)}</div><div class="kpis">${[['workflows','Workflows'],['rules','Rules'],['memories','Memory notes'],['skills','Skills'],['vendors','Vendors mapped'],['threads','Inbox threads'],['signals','Intent signals']].map(([k,l])=>`<div class="kpi"><b>${S[k]}</b><span>${l}</span></div>`).join('')}</div><h3>Functions</h3><div class="grid">${FN().map(f=>`<a href="#fn-${f.id}" style="text-decoration:none;color:inherit"><div class="card" style="border-top:4px solid ${f.color}"><h4>${f.name}</h4><div>${esc(f.desc)}</div><div class="meta" style="margin-top:8px">${K.workflows.filter(w=>w.fn===f.id).length} workflows · ${D.mem.filter(x=>x.fn===f.id).length} notes · ${K.rule_groups.filter(g=>g.fn===f.id).reduce((a,g)=>a+g.rules.length,0)} rules</div></div></a>`).join('')}</div><h3>Not in here, by design</h3><div>${K.excluded.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div>`+teachBox('General')}
else if(VIEW.startsWith('fn-')){const id=VIEW.slice(3),f=FN().find(x=>x.id===id);h=`<h2 style="color:${f.color}">${f.name}</h2><div class="sub">${esc(f.desc)}</div>${teachBox(f.name)}<h3>Workflows</h3><div class="grid">${K.workflows.filter(w=>w.fn===id).map(wfCard).join('')}</div>${rulesHTML(K.rule_groups.filter(g=>g.fn===id))}<h3>Memory notes</h3>${memList(D.mem.filter(x=>x.fn===id||(id==='ops'&&x.fn==='company')))}<h3>Skills & docs</h3>${docList(D.skills.filter(x=>x.fn===id).concat(D.docs.filter(x=>x.fn===id)))}`}
else if(VIEW==='rules')h=`<h2>Rules</h2><div class="sub">Every standing rule, who set it and when.</div>${teachBox('Rules')}${rulesHTML(K.rule_groups)}`;
else if(VIEW==='workflows')h=`<h2>Workflows</h2><div class="sub">What Ace runs, by function.</div>${teachBox('Workflows')}${FN().map(f=>`<h3 style="color:${f.color}">${f.name}</h3><div class="grid">${K.workflows.filter(w=>w.fn===f.id).map(wfCard).join('')}</div>`).join('')}`;
else if(VIEW==='vendors')h=`<h2>Vendors</h2><div class="sub">Live intake gates (from the DB), triggers, fit and terms Ace uses to match. ${D.vendors.length} vendors.</div>${teachBox('Vendors')}<div class="grid">${D.vendors.map(vendorCard).join('')}</div>`;
else if(VIEW==='memory')h=`<h2>Memory notes</h2><div class="sub">Index of Ace's ${D.mem.length} working notes: rules from teammates, vendor terms, people, decisions and daily work logs.</div>${teachBox('Memory')}${FN().concat([{id:'company',name:'Company',color:'#1A4D36'}]).map(f=>`<h3 style="color:${f.color}">${f.name}</h3>${memList(D.mem.filter(x=>x.fn===f.id))}`).join('')}`;
else if(VIEW==='skills')h=`<h2>Skills</h2><div class="sub">Step-by-step workflows Ace follows (full text).</div>${teachBox('Skills')}${docList(D.skills)}`;
else if(VIEW==='docs')h=`<h2>Playbooks & docs</h2><div class="sub">Full text, pulled from the ace-playbook repo and Ace's files on every update.</div>${teachBox('Playbooks')}${docList(D.docs)}`;
else if(VIEW==='inbox')h=`<h2>Ace Inbox</h2><div class="sub">Every text + email thread Ace is in. <a href="../x7inbox/" target="_blank">Open full screen ↗</a></div><iframe src="../x7inbox/"></iframe>`;
else if(VIEW==='signals'){const s=D.signals.slice().sort((a,b)=>(b.priority||0)-(a.priority||0));h=`<h2>Intent signals</h2><div class="sub">${s.length} lead profiles from calls + texts: stack, need, timing, next action.</div><table><tr><th>Person</th><th>Signal</th><th>Next action</th><th>Pri</th></tr>${s.map(x=>`<tr><td><b>${esc(x.name)}</b><div class="meta">${esc(x.role||'')} · ${esc(x.company||'')}<br>${esc(x.vendor||'')} · ${esc(x.date||'')}</div></td><td>${esc(x.summary||'')}</td><td>${esc(x.next_action||'')}</td><td>${esc(x.priority??'')}</td></tr>`).join('')}</table>`}
else if(VIEW==='teach')h=`<h2>Teach log</h2><div class="sub">What the team taught Ace through this page, and where it was filed.</div>${D.teach.length?`<table><tr><th>Date</th><th>From</th><th>Category</th><th>What</th><th>Filed to</th></tr>${D.teach.map(t=>`<tr><td>${esc(t.date)}</td><td>${esc(t.from)}</td><td>${esc(t.cat)}</td><td>${esc(t.text)}</td><td>${esc(t.filed)}</td></tr>`).join('')}</table>`:'<div class="card">Nothing yet. Use "Teach Ace" on any page.</div>'}${teachBox('General')}`;
else if(VIEW==='changelog')h=`<h2>Changelog</h2><table><tr><th style="width:110px">Date</th><th>Change</th></tr>${D.changelog.map(c=>`<tr><td>${esc(c.date)}</td><td>${esc(c.what)}</td></tr>`).join('')}</table>`;
else if(VIEW==='map')h=`<h2>Knowledge map</h2><div class="sub">Ace → functions → workflows, rule groups, skills, vendors. Drag, scroll to zoom, hover for names, click to open.</div><div id="graph"></div>`;
else if(VIEW==='search'){const q=document.getElementById('search').value.toLowerCase().trim(),hit=t=>String(t).toLowerCase().includes(q);const W=K.workflows.filter(w=>hit(w.name+w.trigger+w.steps.join(' '))),R=[];K.rule_groups.forEach(g=>g.rules.forEach(r=>{if(hit(r.join(' ')))R.push([g.name,...r])}));const Mm=D.mem.filter(x=>hit(x.title+x.summary)),V=D.vendors.filter(v=>hit(JSON.stringify(v))),Dd=D.docs.concat(D.skills).filter(d=>hit(d.md));
h=`<h2>Search: “${esc(q)}”</h2>${R.length?`<h3>Rules (${R.length})</h3><table>${R.map(r=>`<tr><td>${esc(r[1])}</td><td style="width:160px">${esc(r[2])} · ${esc(r[3])}</td><td style="width:160px">${esc(r[0])}</td></tr>`).join('')}</table>`:''}${W.length?`<h3>Workflows (${W.length})</h3><div class="grid">${W.map(wfCard).join('')}</div>`:''}${V.length?`<h3>Vendors (${V.length})</h3><div class="grid">${V.map(vendorCard).join('')}</div>`:''}${Mm.length?`<h3>Memory notes (${Mm.length})</h3>${memList(Mm)}`:''}${Dd.length?`<h3>In playbooks/skills (${Dd.length})</h3>${Dd.map(d=>{const t=d.md,i=t.toLowerCase().indexOf(q);return `<div class="card" style="margin-bottom:8px"><b>${esc(d.title||d.name)}</b><div class="meta">…${esc(t.slice(Math.max(0,i-120),i+200))}…</div></div>`}).join('')}`:''}`}
m.innerHTML=h;if(VIEW==='map')graph()}
function graph(){const el=document.getElementById('graph'),W=el.clientWidth,H=640,K=D.k,nodes=[{id:'Ace',t:'root',r:22}],links=[];
FN().forEach(f=>{nodes.push({id:f.name,t:'fn',r:16,c:f.color,go:'fn-'+f.id});links.push({source:'Ace',target:f.name})});
K.workflows.forEach(w=>{nodes.push({id:w.name,t:'wf',r:7,c:fcol(w.fn),go:'fn-'+w.fn});links.push({source:fname(w.fn),target:w.name})});
K.rule_groups.forEach(g=>{nodes.push({id:'Rules: '+g.name,t:'rg',r:9,c:'#C9A96E',go:'rules'});links.push({source:fname(g.fn),target:'Rules: '+g.name})});
D.skills.forEach(s=>{nodes.push({id:'Skill: '+s.name,t:'sk',r:6,c:'#0E2723',go:'skills'});links.push({source:fname(s.fn),target:'Skill: '+s.name});K.workflows.filter(w=>w.sources.includes(s.name)).forEach(w=>links.push({source:'Skill: '+s.name,target:w.name}))});
nodes.push({id:'Vendors',t:'v',r:12,c:'#609D77',go:'vendors'});links.push({source:'GTM',target:'Vendors'},{source:'Ops',target:'Vendors'});
D.vendors.forEach(v=>{if(!nodes.find(n=>n.id===v.name)){nodes.push({id:v.name,t:'vv',r:4,c:'#9DBFA8',go:'vendors'});links.push({source:'Vendors',target:v.name})}});
const ids=new Set(nodes.map(n=>n.id)),L=links.filter(l=>ids.has(l.source)&&ids.has(l.target));
const svg=d3.select(el).append('svg').attr('width',W).attr('height',H),g=svg.append('g');svg.call(d3.zoom().on('zoom',e=>g.attr('transform',e.transform)));
const sim=d3.forceSimulation(nodes).force('link',d3.forceLink(L).id(d=>d.id).distance(d=>d.target.t==='vv'?30:70)).force('charge',d3.forceManyBody().strength(d=>d.t==='vv'?-25:-140)).force('center',d3.forceCenter(W/2,H/2)).force('col',d3.forceCollide(d=>d.r+3)).force('x',d3.forceX(W/2).strength(.09)).force('y',d3.forceY(H/2).strength(.12));
const ln=g.append('g').selectAll('line').data(L).join('line').attr('stroke','#E8E2D4');
const nd=g.append('g').selectAll('g').data(nodes).join('g').style('cursor','pointer').on('click',(e,d)=>{if(d.go)location.hash=d.go}).call(d3.drag().on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y}).on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y}).on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));
nd.append('circle').attr('r',d=>d.r).attr('fill',d=>d.t==='root'?'#1A4D36':d.c).attr('stroke','#fff').attr('stroke-width',1.5);nd.append('title').text(d=>d.id);
nd.filter(d=>['root','fn','rg','v'].includes(d.t)).append('text').text(d=>d.id).attr('x',d=>d.r+4).attr('y',4).attr('font-size',d=>d.t==='fn'||d.t==='root'?13:10).attr('fill','#0E2723').attr('font-weight',600);

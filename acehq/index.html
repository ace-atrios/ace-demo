else if(VIEW==='audiences'){const A=(K.audiences||[]).filter(a=>AUDF==='all'||a.id===AUDF);h=`<div class="eyebrow">Audiences</div><h2>Workflows by audience, <em>and what to build next.</em></h2><div class="sub">Each audience gets its own Ace flow (Taylor × Allan, 10/28). Live workflows first, then planned ones. Add a new workflow to any audience from here.</div><div class="bar">${searchBox()}</div>${audFilter()}${A.map(a=>{const W=K.workflows.filter(w=>AUDS(w).includes(a.id));return `<h3>${esc(a.name)} <span class="cnt">${W.length} live${a.planned.length?' · '+a.planned.length+' planned':''}</span></h3><div class="sub" style="margin-top:-6px">${esc(a.desc)}</div><div class="grid">${W.map(wfCard).join('')}${a.planned.map(p=>`<div class="wf planned"><div class="wf-top"><span class="kind pl">Planned</span></div><h4>${esc(p.split(':')[0])}</h4><p>${esc((x=>x.charAt(0).toUpperCase()+x.slice(1))(p.includes(':')?p.slice(p.indexOf(':')+1).trim():''))}</p></div>`).join('')}<div class="wf addwf" onclick="newWf('${a.id}')"><span>+</span><h4>Build a new ${esc(a.name.toLowerCase())} workflow</h4><p>Describe it in chat and Ace drafts it for review.</p></div></div>`}).join('')}`}

else if(VIEW.startsWith('fn-')){const id=VIEW.slice(3),f=FN().find(x=>x.id===id);h=`<div class="eyebrow">Team</div><h2>${f.name}, <em>how Ace works here.</em></h2><div class="sub">${esc(f.desc)}</div><div class="bar">${searchBox()}</div>${(()=>{const W=(['eng','personal'].includes(id)?(x=>x):fw)(K.workflows.filter(w=>w.fn===id)),T=W.filter(w=>w.kind!=='schedule'),Sc=W.filter(w=>w.kind==='schedule');return (['eng','personal'].includes(id)?'':audFilter())+`<h3>Triggered workflows <span class="cnt">${T.length}</span></h3><div class="sub" style="margin-top:-6px">Run when something happens: a message, a request, a booking.</div>${T.length?`<div class="grid">${T.map(wfCard).join('')}</div>`:`<div class="none">None yet</div>`}<h3>Scheduled workflows <span class="cnt">${Sc.length}</span></h3><div class="sub" style="margin-top:-6px">Automated: run on a clock, whether or not anyone asks.</div>${Sc.length?`<div class="grid">${Sc.map(wfCard).join('')}</div>`:`<div class="none">None yet</div>`}`})()}${rulesHTML(K.rule_groups.filter(g=>g.fn===id))}<h3>Memory notes</h3>${memList(D.mem.filter(x=>x.fn===id||(id==='ops'&&x.fn==='company')))}<h3>Skills & docs</h3>${docList(D.skills.filter(x=>x.fn===id).concat(D.docs.filter(x=>x.fn===id)))}`}
else if(VIEW==='rules'||VIEW==='workflows'){const t=[['rules','Rules'],['workflows','Workflows']];h=VIEW==='rules'?`<div class="eyebrow">Rules</div><h2>The rules Ace follows, <em>and who set them.</em></h2><div class="bar">${searchBox()}</div>${rulesHTML(K.rule_groups)}`:`<div class="eyebrow">Workflows</div><h2>What Ace runs, <em>by function.</em></h2><div class="bar">${searchBox()}</div>${FN().map(f=>`<h3>${f.name}</h3><div class="grid">${K.workflows.filter(w=>w.fn===f.id).map(wfCard).join('')}</div>`).join('')}`}
else if(VIEW==='vendors')h=`<div class="eyebrow">Vendors</div><h2>Every active vendor, <em>with its gates and perks.</em></h2><div class="sub">Only vendors currently active on Atrios (synced from the DB). Click one for its perk, gates, triggers and terms. ${D.vendors.length} vendors.</div><div class="bar">${searchBox()}</div><div class="vlist">${D.vendors.map(vendorCard).join('')}</div>`;
else if(VIEW==='memory')h=`<div class="eyebrow">Memory</div><h2>Ace's working notes, <em>by function.</em></h2><div class="sub">${D.mem.length} notes: rules from teammates, vendor terms, people, decisions and daily work logs.</div><div class="bar">${searchBox()}</div>${FN().concat([{id:'company',name:'Company'}]).map(f=>`<h3>${f.name}</h3>${memList(D.mem.filter(x=>x.fn===f.id))}`).join('')}`;
else if(VIEW==='docs'||VIEW==='skills'){const t=[['docs','Playbooks & docs'],['skills','Skills']];h=`<div class="eyebrow">Playbooks</div><h2>The full playbooks, <em>word for word.</em></h2><div class="sub">Pulled from the ace-playbook repo and Ace's skill files on every update.</div><div class="bar">${searchBox()}</div><h3>Playbooks & docs</h3>${docList(D.docs)}<h3>Skills</h3>${docList(D.skills)}`}
else if(VIEW==='inbox')h=`<div class="eyebrow">Live</div><h2>Ace Inbox</h2><div class="sub">Every text + email thread Ace is in. <a href="../x7inbox/" target="_blank">Open full screen ↗</a></div><iframe src="../x7inbox/"></iframe>`;
else if(VIEW==='signals'){const s=D.signals.slice().sort((a,b)=>(b.priority||0)-(a.priority||0));h=`<div class="eyebrow">Live</div><h2>Intent signals, <em>who needs what next.</em></h2><div class="sub">${s.length} lead profiles from calls + texts.</div><div class="bar">${searchBox()}</div><div class="grid">${s.map(x=>`<div class="card"><div class="meta">${esc(x.company||'')} · ${esc(x.date||'')}</div><h4>${esc(x.name)}</h4><div class="meta">${esc(x.role||'')}</div><div class="tint"><div class="lab">Next action</div>${esc(x.next_action||'')}</div><div style="line-height:1.5">${esc(x.summary||'')}</div>${x.vendor?`<div style="margin-top:8px"><span class="pill gold">${esc(x.vendor)}</span>${x.priority?`<span class="pill">P${esc(x.priority)}</span>`:''}</div>`:''}</div>`).join('')}</div>`}
else if(VIEW==='teach')h=`<div class="eyebrow">Teach log</div><h2>What the team taught Ace, <em>and where it went.</em></h2>${D.teach.length?`<div class="list"><div class="row h" style="grid-template-columns:90px 100px 1fr 160px"><span>Date</span><span>From</span><span>What</span><span>Filed to</span></div>${D.teach.map(t=>`<div class="row" style="grid-template-columns:90px 100px 1fr 160px"><span class="meta">${esc(t.date)}</span><span>${esc(t.from)}</span><span>${esc(t.text)}<div class="meta">${esc(t.cat)}</div></span><span class="meta">${esc(t.filed)}</span></div>`).join('')}</div>`:'<div class="card">Nothing yet.</div>'}<h3>Changelog</h3><div class="list">${D.changelog.map(c=>`<div class="row" style="grid-template-columns:110px 1fr"><span class="meta">${esc(c.date)}</span><span>${esc(c.what)}</span></div>`).join('')}</div>`;
else if(VIEW==='map')h=`<div class="eyebrow">Knowledge map</div><h2>How it all connects.</h2><div class="sub">Ace → functions → workflows, rule groups, skills, vendors. Drag, scroll to zoom, click a node to open it.</div><div id="graph"></div>`;
else if(VIEW==='search'){const q=Q.toLowerCase().trim(),hit=t=>String(t).toLowerCase().includes(q);const W=K.workflows.filter(w=>hit(w.name+(w.summary||'')+w.trigger+w.steps.join(' '))),R=[];K.rule_groups.forEach(g=>g.rules.forEach(r=>{if(hit(r.join(' ')))R.push(r.concat([g.name]))}));const Mm=D.mem.filter(x=>hit(x.title+x.summary+(x.md||''))),V=D.vendors.filter(v=>hit(JSON.stringify(v))),Dd=D.docs.concat(D.skills).filter(d=>hit(d.md)),Sg=D.signals.filter(x=>hit(JSON.stringify(x)));
const n=R.length+W.length+Mm.length+V.length+Dd.length+Sg.length;
h=`<div class="eyebrow">Search</div><h2>${n} results <em>for “${esc(Q)}”</em></h2><div class="bar">${searchBox()}</div>${R.length?`<h3>Rules</h3><div class="list">${R.map(r=>`<div class="row"><span>${esc(r[0])}<div class="meta">${esc(r[3])}</div></span><span class="meta">${esc(r[1])}</span><span class="meta">${esc(r[2])}</span></div>`).join('')}</div>`:''}${W.length?`<h3>Workflows</h3><div class="grid">${W.map(wfCard).join('')}</div>`:''}${V.length?`<h3>Vendors</h3><div class="vlist">${V.map(vendorCard).join('')}</div>`:''}${Mm.length?`<h3>Memory notes</h3>${memList(Mm)}`:''}${Sg.length?`<h3>Intent signals</h3><div class="list">${Sg.map(x=>`<div class="row" style="grid-template-columns:1fr 2fr"><span><b style="font-weight:500">${esc(x.name)}</b><div class="meta">${esc(x.company||'')}</div></span><span class="meta">${esc(x.summary||'')}</span></div>`).join('')}</div>`:''}${Dd.length?`<h3>In playbooks & skills</h3>${Dd.map(d=>{const t=d.md,i=t.toLowerCase().indexOf(q);return `<div class="card" style="margin-bottom:10px"><b style="font-weight:500">${esc(d.title||d.name)}</b><div class="meta" style="margin-top:4px">…${esc(t.slice(Math.max(0,i-140),i+220))}…</div></div>`}).join('')}`:''}`}
m.innerHTML=h;wireSearch();if(VIEW==='search'){const s=document.getElementById('search');if(s){s.focus();s.setSelectionRange(s.value.length,s.value.length)}}if(VIEW==='map')graph();document.getElementById('cctx').textContent=CCTX=curCat()}
function graph(){const el=document.getElementById('graph'),W=el.clientWidth,H=680,K=D.k,nodes=[{id:'Ace',t:'root',r:24}],links=[];
FN().forEach(f=>{nodes.push({id:f.name,t:'fn',r:17,c:f.color,go:'fn-'+f.id});links.push({source:'Ace',target:f.name})});
K.workflows.forEach(w=>{nodes.push({id:w.name,t:'wf',r:7,c:fcol(w.fn),go:'fn-'+w.fn});links.push({source:fname(w.fn),target:w.name})});
K.rule_groups.forEach(g=>{nodes.push({id:'Rules: '+g.name,t:'rg',r:9,c:'#C9A96E',go:'rules'});links.push({source:fname(g.fn),target:'Rules: '+g.name})});
D.skills.forEach(s=>{nodes.push({id:'Skill: '+s.name,t:'sk',r:6,c:'#0E2723',go:'docs'});links.push({source:fname(s.fn),target:'Skill: '+s.name});K.workflows.filter(w=>w.sources.includes(s.name)).forEach(w=>links.push({source:'Skill: '+s.name,target:w.name}))});
nodes.push({id:'Vendors',t:'v',r:13,c:'#609D77',go:'vendors'});links.push({source:'GTM',target:'Vendors'},{source:'Ops',target:'Vendors'});
D.vendors.forEach(v=>{if(!nodes.find(n=>n.id===v.name)){nodes.push({id:v.name,t:'vv',r:4,c:'#A9C7B2',go:'vendors'});links.push({source:'Vendors',target:v.name})}});
const ids=new Set(nodes.map(n=>n.id)),L=links.filter(l=>ids.has(l.source)&&ids.has(l.target));
const svg=d3.select(el).append('svg').attr('width',W).attr('height',H),g=svg.append('g');svg.call(d3.zoom().on('zoom',e=>g.attr('transform',e.transform)));
const sim=d3.forceSimulation(nodes).force('link',d3.forceLink(L).id(d=>d.id).distance(d=>d.target.t==='vv'?30:72)).force('charge',d3.forceManyBody().strength(d=>d.t==='vv'?-25:-150)).force('center',d3.forceCenter(W/2,H/2)).force('col',d3.forceCollide(d=>d.r+3)).force('x',d3.forceX(W/2).strength(.09)).force('y',d3.forceY(H/2).strength(.12));
const ln=g.append('g').selectAll('line').data(L).join('line').attr('stroke','#E6E2DA');
const nd=g.append('g').selectAll('g').data(nodes).join('g').style('cursor','pointer').on('click',(e,d)=>{if(d.go)location.hash=d.go}).call(d3.drag().on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y}).on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y}).on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));
nd.append('circle').attr('r',d=>d.r).attr('fill',d=>d.t==='root'?'#0E2723':d.c).attr('stroke','#fff').attr('stroke-width',2);nd.append('title').text(d=>d.id);
nd.filter(d=>['root','fn','rg','v'].includes(d.t)).append('text').text(d=>d.id).attr('x',d=>d.r+5).attr('y',4).attr('font-size',d=>d.t==='fn'||d.t==='root'?14:10.5).attr('fill','#0E2723').attr('font-family',d=>d.t==='fn'||d.t==='root'?'Newsreader,Georgia,serif':'Aspekta,sans-serif');
sim.on('tick',()=>{ln.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);nd.attr('transform',d=>`translate(${d.x},${d.y})`)})}
if(CODE)load();else document.getElementById('gate').style.display='flex';
setInterval(()=>{if(D&&VIEW!=='search')load()},300000);
</script></body></html>

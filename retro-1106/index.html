<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atrios retro · Nov 6</title>
<style>
:root{--ink:#14261c;--mut:#5d6b62;--bg:#f6f4ee;--card:#fff;--line:#e3e0d6;--g:#1f7a4a;--y:#b07d12;--r:#b23b2e;--acc:#173d2b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Inter",Segoe UI,sans-serif}
main{max-width:1080px;margin:0 auto;padding:40px 24px 80px}
section{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 32px;margin:0 0 22px}
.hero{background:var(--acc);color:#fff;border:none}.hero h1{font:600 40px/1.15 Georgia,serif;margin:6px 0 10px}.hero .sub{opacity:.8;margin:0}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:12px;opacity:.8}
h2{font:600 24px Georgia,serif;margin:0 0 16px}h3{font-size:15px;margin:0 0 10px;color:var(--acc)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.kpis.four{grid-template-columns:repeat(4,1fr)}
.k{border:1px solid var(--line);border-radius:14px;padding:14px 16px}.k b{display:block;font:600 30px Georgia,serif}.kpis.three .k b,.kpis.four .k b{font-size:18px}.k span{display:block;font-weight:600}.k i{display:block;font-style:normal;color:var(--mut);font-size:13px;margin-top:2px}
.k.good b{color:var(--g)}.k.bad b{color:var(--r)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}.card{border:1px solid var(--line);border-radius:14px;padding:16px}
.bar{display:grid;grid-template-columns:1.6fr 2fr auto;gap:10px;align-items:center;margin:7px 0;font-size:13px}.bar div{height:12px;background:var(--acc);border-radius:6px;min-width:6px}.bar em{font-style:normal;font-weight:600;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--mut);font-weight:600;border-bottom:2px solid var(--line);padding:8px 6px}td{border-bottom:1px solid var(--line);padding:8px 6px;vertical-align:top}
.g{color:var(--g)}.y{color:var(--y)}.r{color:var(--r)}.note{color:var(--mut);font-size:13px;margin:8px 0 0}.lead{margin-top:-6px}
.callout{margin-top:14px;background:#eef4ef;border-left:4px solid var(--acc);padding:12px 16px;border-radius:8px}
ul,ol{margin:0;padding-left:20px}li{margin:5px 0}.next{border:2px solid var(--acc)}.next li{font-size:17px;margin:9px 0}
footer{text-align:center;color:var(--mut);font-size:12px}
#gate{max-width:380px;margin:18vh auto;text-align:center}#gate input{font-size:18px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;width:100%}#gate button{margin-top:10px;padding:10px 18px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-size:16px}
@media(max-width:760px){.kpis,.two,.kpis.four{grid-template-columns:1fr}}
@media print{body{background:#fff}section{break-inside:avoid}}
</style></head><body>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Atrios event attendees</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDEBE6;--ink:#1d1b18;--mut:#6b6760;--line:#dcd6ca;--gold:#A27B3A;--green:#1F3A2E}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.45 Inter,system-ui,sans-serif;color:var(--ink)}
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:9}#gate form{background:#fff;border-radius:18px;padding:34px;width:340px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.08)}#gate input{width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;background:#F2F0EB;font-size:15px;margin:14px 0}#gate button,.btn{background:var(--green);color:#fff;border:0;border-radius:20px;padding:8px 18px;cursor:pointer;font:600 13px Inter}
.wrap{max-width:1400px;margin:0 auto;padding:28px 36px 80px}
h1{font:600 40px/1.1 'Cormorant Garamond',serif;margin:0}h1 em{color:var(--gold);font-style:normal}.sub{color:var(--mut);margin-top:6px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.kpis{display:flex;gap:10px;margin:18px 0 10px;flex-wrap:wrap}.kpi{background:#fff;border-radius:14px;padding:12px 18px;min-width:120px}.kpi b{font:600 26px 'Cormorant Garamond',serif;display:block}.kpi span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.bar{background:#fff;border-radius:16px;padding:14px 16px;margin:10px 0;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);width:82px}
.chip{border:1px solid var(--line);background:#F7F5F0;border-radius:16px;padding:4px 11px;cursor:pointer;font-size:12.5px;user-select:none}.chip.on{background:var(--green);color:#fff;border-color:var(--green)}.chip i{font-style:normal;opacity:.6;margin-left:4px}
input.s{flex:1;min-width:240px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:#F7F5F0;font:14px Inter}
select{padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:#F7F5F0;font:13px Inter}
.grp{margin-top:18px}.grp h3{font:600 22px 'Cormorant Garamond',serif;margin:0 0 6px;display:flex;gap:8px;align-items:baseline}.grp h3 span{font:500 13px Inter;color:var(--mut)}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding:9px 12px;background:#F7F5F0;cursor:pointer;white-space:nowrap}td{padding:9px 12px;border-top:1px solid #f0ece4;vertical-align:top}
td .t{color:var(--mut);font-size:12.5px}.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:#F1EEE7;margin:1px 3px 1px 0}.tag.geo{background:#E8F0EA;color:var(--green)}.tag.st{background:#FBF3E4;color:#8a6420}.tag.fi{background:#EFE7F7;color:#5b3d82}
a{color:var(--green)}
</style></head><body>
<div id="gate"><form id="gf"><div style="font:600 26px 'Cormorant Garamond',serif">Event attendees</div><div class="sub">Same passcode as the Ace Inbox.</div><input id="pc" type="password"><div id="ge" style="color:#b0553f;font-size:13px"></div><button>Open</button></form></div>
<div class="wrap">
<div class="top"><div><h1>Event attendees, <em>everyone we've met.</em></h1><div class="sub">Everyone who registered for or attended an Atrios event, plus people we want at the next one. Filter by city, type, event and status. Pulled from Luma; future invites added by the team.</div></div><div style="text-align:right"><div class="sub" id="upd"></div><button class="btn" style="margin-top:8px" onclick="csv()">⬇ Download CSV</button></div></div>
<div class="kpis" id="kpis"></div>
<div class="bar">
 <div class="row"><input class="s" id="q" placeholder="Search name, company, title, email…" oninput="S.q=this.value;render()"><label style="width:auto">Group by</label><select id="gb" onchange="S.gb=this.value;render()"><option value="geo">City</option><option value="category">Type</option><option value="events">Event</option><option value="status">Status</option><option value="">No grouping</option></select></div>
 <div class="row"><label>City</label><div id="f_geo" class="row"></div></div>
 <div class="row"><label>Type</label><div id="f_category" class="row"></div></div>
 <div class="row"><label>Event</label><div id="f_events" class="row"></div></div>
 <div class="row"><label>Status</label><div id="f_status" class="row"></div></div>
</div>
<div id="list"></div>
</div>
<script>
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dec(B,code){try{const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]);const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(B.s),iterations:200000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(B.i)},key,b64(B.c))))}catch(e){return null}}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D=null,CODE=localStorage.getItem('aceinbox_pc');const S={q:'',gb:'geo',f:{geo:new Set(),category:new Set(),events:new Set(),status:new Set()},sort:'name'};
const GEO_ORDER=['NYC','SF Bay Area','LA','Boston','Other US','Canada','International','Unknown'];
const arr=(p,k)=>Array.isArray(p[k])?(p[k].length?p[k]:['(none)']):[p[k]];
function pass(p,skip){if(S.q){const s=S.q.toLowerCase();if(!(p.name+' '+p.company+' '+p.title+' '+p.email+' '+p.notes).toLowerCase().includes(s))return false}
 for(const k in S.f){if(k===skip||!S.f[k].size)continue;if(!arr(p,k).some(v=>S.f[k].has(v)))return false}return true}
function chips(k){const c={};D.people.filter(p=>pass(p,k)).forEach(p=>arr(p,k).forEach(v=>c[v]=(c[v]||0)+1));
 let keys=[...new Set(D.people.flatMap(p=>arr(p,k)))];if(k==='geo')keys.sort((a,b)=>GEO_ORDER.indexOf(a)-GEO_ORDER.indexOf(b));else keys.sort((a,b)=>(c[b]||0)-(c[a]||0));
 const el=document.getElementById('f_'+k);el.innerHTML='';keys.forEach(v=>{const s=document.createElement('span');s.className='chip'+(S.f[k].has(v)?' on':'');s.innerHTML=esc(v)+'<i>'+(c[v]||0)+'</i>';s.onclick=()=>tog(k,v);el.appendChild(s)})}
function tog(k,v){S.f[k].has(v)?S.f[k].delete(v):S.f[k].add(v);render()}
function rowsHTML(L){return `<table><tr><th onclick="S.sort='name';render()">Name</th><th onclick="S.sort='company';render()">Company / title</th><th>Type</th><th onclick="S.sort='geo';render()">City</th><th>Events</th><th>Status</th><th>Contact</th></tr>${L.map(p=>`<tr><td><b>${esc(p.name)}</b>${p.on_atrios?' <span class="tag">on Atrios</span>':''}${p.notes?`<div class="t">${esc(p.notes)}</div>`:''}</td><td>${esc(p.company)}<div class="t">${esc(p.title)}</div></td><td>${p.category.map(c=>`<span class="tag">${esc(c)}</span>`).join('')}</td><td><span class="tag geo">${esc(p.geo)}</span></td><td>${p.events.map(e=>`<div class="t">${esc(e)}</div>`).join('')}</td><td><span class="tag ${p.status==='Future invite'?'fi':'st'}">${esc(p.status)}</span></td><td>${p.email?`<div class="t">${esc(p.email)}</div>`:''}${p.linkedin?`<a href="${esc(p.linkedin)}" target="_blank">LinkedIn</a>`:''}</td></tr>`).join('')}</table>`}
function render(){['geo','category','events','status'].forEach(chips);
 const L=D.people.filter(p=>pass(p)).sort((a,b)=>String(a[S.sort]).localeCompare(String(b[S.sort])));
 document.getElementById('kpis').innerHTML=[[L.length,'people'],[L.filter(p=>p.geo==='NYC').length,'in NYC'],[L.filter(p=>p.category.includes('Founder')).length,'founders'],[L.filter(p=>p.status==='Future invite').length,'future invites'],[L.filter(p=>p.on_atrios).length,'on Atrios']].map(([n,l])=>`<div class="kpi"><b>${n}</b><span>${l}</span></div>`).join('');
 const el=document.getElementById('list');if(!S.gb){el.innerHTML=rowsHTML(L);return}
 const G={};L.forEach(p=>arr(p,S.gb).forEach(v=>(G[v]=G[v]||[]).push(p)));let ks=Object.keys(G);ks.sort(S.gb==='geo'?(a,b)=>GEO_ORDER.indexOf(a)-GEO_ORDER.indexOf(b):(a,b)=>G[b].length-G[a].length);
 el.innerHTML=ks.map(k=>`<div class="grp"><h3>${esc(k)} <span>${G[k].length}</span></h3>${rowsHTML(G[k])}</div>`).join('')}
function csv(){const L=D.people.filter(p=>pass(p));const h=['name','company','title','category','geo','events','status','email','phone','linkedin','notes'];const q=v=>'"'+String(Array.isArray(v)?v.join('; '):v??'').replace(/"/g,'""')+'"';const t=[h.join(',')].concat(L.map(p=>h.map(k=>q(p[k])).join(','))).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='atrios-event-attendees.csv';a.click()}
async function load(){const B=await (await fetch('data.json?v='+Date.now(),{cache:'no-store'})).json();const d=await dec(B,CODE||'');if(!d){document.getElementById('gate').style.display='flex';return false}D=d;document.getElementById('gate').style.display='none';document.getElementById('upd').textContent='Updated '+new Date(d.gen).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});render();return true}
document.getElementById('gf').onsubmit=async e=>{e.preventDefault();CODE=document.getElementById('pc').value.trim();if(await load())localStorage.setItem('aceinbox_pc',CODE);else document.getElementById('ge').textContent='Wrong passcode'};
load();
</script></body></html>

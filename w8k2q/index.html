<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#07080b">
<title>Williamsburg Apartment Hunt</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Apt Hunt">
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<style>
:root{--bg:#f5f5f7;--card:#fff;--t:#111;--m:#6e6e73;--line:#e5e5ea;--chip:#f0f0f3;--acc:#0a84ff;--star:#ffb300;--soft:#f7f7f9}
@media (prefers-color-scheme:dark){:root{--bg:#0b0b0c;--card:#1c1c1e;--t:#f5f5f7;--m:#98989f;--line:#2c2c2e;--chip:#2c2c2e;--soft:#242426}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{overflow-x:hidden;margin:0;font:14px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;background:var(--bg);color:var(--t);padding-bottom:30px}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:10px 12px 8px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.4px}
.sync{font-size:11px;color:var(--m);display:flex;align-items:center;gap:5px}.dot{width:7px;height:7px;border-radius:50%;background:#30d158}
.seg{display:flex;background:var(--chip);border-radius:9px;padding:2px;margin-top:8px}
.seg button{flex:1;border:0;background:transparent;color:var(--t);font:600 13px -apple-system,system-ui;padding:6px 4px;border-radius:7px}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.sorts{display:flex;gap:6px;margin-top:8px;overflow-x:auto}

.hint{font-size:11px;color:var(--m);padding:6px 14px 0}
main{padding:2px 10px}
.card{background:var(--card);border-radius:14px;padding:10px 12px;margin:8px 0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;border:1px solid var(--line)}
.ghost{opacity:.25}.chosen{box-shadow:0 10px 30px rgba(0,0,0,.3)}.dragging{opacity:1!important;box-shadow:0 18px 40px rgba(0,0,0,.35)!important}
.r1{display:flex;gap:8px;align-items:flex-start}

.price{text-align:right;flex:none}.price b{font-size:16px;letter-spacing:-.3px}.price div{font-size:11px;color:var(--m)}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.3px;color:var(--acc);border:1px solid var(--acc);border-radius:5px;padding:0 4px;margin-left:4px;vertical-align:2px}
.cm{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:8px 0 6px}

.chips{display:flex;flex-wrap:wrap;gap:4px}.chip{font-size:11px;background:var(--chip);border-radius:6px;padding:2px 6px;color:var(--t)}.chip.p{background:var(--acc);color:#fff}.chip.g{background:#30d158;color:#fff}.chip.y{background:#ffd60a;color:#1c1c1e}
.meta{font-size:11px;color:var(--m);margin-top:5px}
ul.n{margin:6px 0 0;padding-left:16px;font-size:12px}ul.n li{margin:1px 0}
.act{display:flex;gap:6px;margin-top:8px}.go{flex:1;text-align:center;background:var(--t);color:var(--card);text-decoration:none;border-radius:9px;padding:7px;font-weight:600;font-size:13px}
.st{border:1px solid var(--line);background:transparent;color:var(--m);border-radius:9px;width:44px;font-size:17px}.st.on{color:var(--star);border-color:var(--star)}
.sortbtn{display:flex;align-items:center;gap:6px;margin-top:8px;border:1px solid var(--line);background:var(--card);color:var(--t);border-radius:10px;padding:6px 10px;font:600 13px -apple-system,system-ui}

.sheet .in{background:var(--card);width:100%;border-radius:16px 16px 0 0;padding:14px 14px max(16px,env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 8px;font-size:15px}.opt{display:flex;justify-content:space-between;width:100%;border:0;background:transparent;color:var(--t);font:15px -apple-system,system-ui;padding:11px 2px;border-bottom:1px solid var(--line)}
.opt.on{font-weight:700}.opt.on::after{content:"✓";color:var(--acc)}
.dir{display:flex;background:var(--chip);border-radius:9px;padding:2px;margin:12px 0 4px}.dir button{flex:1;border:0;background:transparent;color:var(--t);font:600 13px -apple-system,system-ui;padding:8px;border-radius:7px}.dir button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.dir button:disabled{opacity:.35}
.phb{flex:1;border:1px solid var(--line);background:transparent;color:var(--t);border-radius:9px;font:600 13px -apple-system,system-ui}
.strip{display:none;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;margin-top:8px;padding-bottom:2px}.strip.on{display:flex}
.strip img{flex:none;height:120px;width:170px;object-fit:cover;border-radius:9px;scroll-snap-align:start;background:var(--soft)}
.lb{position:fixed;inset:0;z-index:30;background:#000;display:none;flex-direction:column}.lb.on{display:flex}
.lb .bar{display:flex;justify-content:space-between;align-items:center;color:#fff;padding:max(12px,env(safe-area-inset-top)) 14px 8px;font:600 14px -apple-system,system-ui}
.lb .x{border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:50%;width:34px;height:34px;font-size:18px}
.lb .sc{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory}.lb .sc div{flex:none;width:100vw;height:100%;display:flex;align-items:center;justify-content:center;scroll-snap-align:center}
.lb .sc img{max-width:100%;max-height:100%;object-fit:contain}
@keyframes jig{0%{transform:rotate(-.6deg)}50%{transform:rotate(.6deg)}100%{transform:rotate(-.6deg)}}
body.edit .card.sel{animation:jig .26s infinite ease-in-out}
.del{display:none;position:absolute;top:-7px;left:-7px;width:26px;height:26px;border-radius:50%;border:0;background:#ff3b30;color:#fff;font:700 15px -apple-system,system-ui;line-height:26px;z-index:3;box-shadow:0 2px 6px rgba(0,0,0,.3)}
body.edit .card.sel .del{display:block}.card{position:relative}
.done{display:none;border:0;background:var(--acc);color:#fff;border-radius:14px;padding:5px 14px;font:600 13px -apple-system,system-ui}
.toast{width:max-content;max-width:92vw;white-space:nowrap;position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#1c1c1e;color:#fff;border-radius:12px;padding:10px 14px;font:14px -apple-system,system-ui;display:none;gap:14px;align-items:center;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.35)}.toast.on{display:flex}.toast button{border:0;background:none;color:#0a84ff;font:600 14px -apple-system,system-ui}
.tour{display:block;width:100%;margin-top:6px;text-align:center;border:1px solid var(--acc);color:var(--acc);background:transparent;border-radius:9px;padding:7px;font:600 13px -apple-system,system-ui;text-decoration:none}
.tour.req{border-color:var(--line);color:var(--m)}
.fchips{display:flex;flex-wrap:wrap;gap:8px}.fc{border:1px solid var(--line);background:transparent;color:var(--t);border-radius:18px;padding:8px 12px;font:14px -apple-system,system-ui}.fc.on{background:var(--acc);border-color:var(--acc);color:#fff}.fc span{color:var(--m);font-size:12px;margin-left:4px}.fc.on span{color:#dbeaff}
.card.lift{z-index:50;box-shadow:0 22px 50px rgba(0,0,0,.38)!important;transition:box-shadow .15s!important;animation:none!important}
.card.shift{transition:transform .22s cubic-bezier(.2,.8,.2,1)}
body.dragging-on{overflow:hidden;touch-action:none}
.empty{color:var(--m);text-align:center;margin:30px}.lnk{background:none;border:0;color:var(--acc);font-size:11px;padding:0}

/* ===== v9 tech theme ===== */

</style></head><body>
<header><div class="top"><h1>Williamsburg Apartment Hunt</h1><div class="syncbox"><div class="sync"><span class="dot" id="dot"></span><span id="synctxt">Synced</span></div><div class="pulled" id="pulled"></div></div></div>
<div class="seg" id="area"><button data-a="bk">Brooklyn · <span id="cbk">0</span></button><button data-a="mh">Manhattan · <span id="cmh">0</span></button></div>
<div class="seg"><button data-t="top" class="on">★ Favorites</button><button data-t="all">All · <span id="ca">0</span></button></div>
<div style="display:flex;gap:8px"><button class="sortbtn" id="sortbtn">⇅ Sort <span id="sortlbl">Default</span></button><button class="sortbtn" id="filtbtn">⚲ Filter <span id="filtlbl">None</span></button></div><div class="srch"><input id="q" type="search" placeholder="Search address, building, loft, pool…" autocomplete="off" autocorrect="off" spellcheck="false"><button id="qx" aria-label="Clear">✕</button></div></header>
<div class="hint" id="hint"></div><div id="showing" style="display:none;margin:6px 10px 0;padding:6px 10px;border-radius:9px;background:var(--chip);font:600 12px -apple-system,system-ui;color:var(--t)"></div>
<main id="list"></main><div class="toast" id="toast"><span id="toastt">Deleted</span><button id="undo">Undo</button></div>
<div class="sheet" id="sheet"><div class="in"><h3>Sort by</h3><div id="opts"></div><div class="dir"><button data-d="1" id="d1">Low → High</button><button data-d="-1" id="d2">High → Low</button></div></div></div>
<div class="sheet" id="csheet"><div class="in"><h3 id="ctitle">Comments</h3><div id="clist" class="clist"></div><div class="cwho"><span>Posting as</span><button data-w="Allan">Allan</button><button data-w="Eliza">Eliza</button></div><div class="cin"><textarea id="ctext" rows="2" placeholder="Add a comment…"></textarea><button id="cpost">Post</button></div></div></div>
<div class="sheet" id="fsheet"><div class="in"><h3>Filters <span style="font-weight:400;color:var(--m);font-size:13px">(must have all selected)</span></h3><div class="fchips" id="fchips"></div><div style="display:flex;gap:8px;margin-top:12px"><button class="opt" id="fclear" style="justify-content:center;border:1px solid var(--line);border-radius:10px">Clear</button><button class="opt" id="fdone" style="justify-content:center;background:linear-gradient(90deg,#3b82f6,#7c3aed);color:#fff;font-weight:600;border:0;border-radius:10px">Show results</button></div></div></div>

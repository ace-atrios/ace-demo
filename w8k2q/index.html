function cmModes(r,who){if(who==='sc')return r.sc?['best','bike','walk']:[];const m=(r.cm||{})[who]||{};return ['walk','bike','transit','drive'].filter(k=>m[k]!=null)}
function cmMode(r,who){const ms=cmModes(r,who);let m=CM[who];if(who==='allan'&&m==='default')m=/walk/.test(r.allan)?'walk':'transit';return ms.includes(m)?m:(ms[0]||null)}
function cmv(r,who){const m=cmMode(r,who);if(who==='sc')return r.sc?(m==='best'?r.sc.best:r.sc[m]):99;if(!r.cm||!m)return who==='allan'?r.amin:r.emin;return r.cm[who][m]}
function cmBox(r,who,label){const m=cmMode(r,who),ms=cmModes(r,who);
 let sub;if(who==='sc')sub=(m==='best'?`🚲 ${r.sc.bike} · 🚶 ${r.sc.walk} min`:`${MODE_IC[m]} ${MODE_NM[m]}`)+' · '+esc(r.sc.name.split(' (')[0]);
 else if(m==='transit')sub=how(who==='allan'?r.allan:r.eliza);else if(m==='walk'&&who==='allan'&&/walk/.test(r.allan))sub=how(r.allan);else sub=`${MODE_IC[m]||''} ${MODE_NM[m]||''}`;
 const dots=ms.length>1?`<span class="cmd">${ms.map(k=>`<i class="${k===m?'on':''}">${MODE_IC[k]}</i>`).join('')}</span>`:'';
 return `<div class="c cmt" data-cm="${who}" data-id="${r.id}"><span class="l">${label}</span><b>${cmv(r,who)} min</b><div class="h">${sub}</div>${dots}</div>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-cm]');if(!b)return;e.preventDefault();e.stopPropagation();
 const who=b.dataset.cm,r=byId[b.dataset.id];const ms=cmModes(r,who);if(ms.length<2)return;const cur=cmMode(r,who);CM[who]=ms[(ms.indexOf(cur)+1)%ms.length];
 localStorage.setItem('cmModes',JSON.stringify(CM));if(navigator.vibrate)navigator.vibrate(8);render()},true);
const SORTS=[['mine','Default'],['newk','New'],['amin','Allan commute'],['emin','Eliza commute'],['rnum','Rent'],['tmin','Walk to train'],['scmin','solidcore']];
function drawSheet(){document.getElementById('opts').innerHTML=SORTS.map(([k,l])=>`<button class="opt ${k===sort?'on':''}" data-k="${k}">${l}</button>`).join('');
 document.getElementById('d1').textContent=sort==='newk'?'Newest first':'Low → High';document.getElementById('d2').textContent=sort==='newk'?'Oldest first':'High → Low';
 document.querySelectorAll('.dir button').forEach(b=>{b.disabled=sort==='mine';b.classList.toggle('on',sort!=='mine'&&+b.dataset.d===dir)});
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{sort=b.dataset.k;drawSheet();upd()})}
function upd(){const l=SORTS.find(s=>s[0]===sort)[1];document.getElementById('sortlbl').textContent=sort==='mine'?l:sort==='newk'?(dir>0?'Newest':'Oldest'):l+(dir>0?' ↑':' ↓');render()}
document.getElementById('sortbtn').onclick=()=>{drawSheet();document.getElementById('sheet').classList.add('on')};
document.getElementById('sheet').onclick=e=>{if(e.target.id==='sheet')e.currentTarget.classList.remove('on')};
document.querySelectorAll('.dir button').forEach(b=>b.onclick=()=>{dir=+b.dataset.d;drawSheet();upd();document.getElementById('sheet').classList.remove('on')});
const open={};
function lbOpen(id,i){const r=byId[id];const sc=document.getElementById('lbsc');sc.innerHTML=r.ph.map(u=>`<div><img loading="lazy" src="${big(u)}"></div>`).join('');
 document.getElementById('lb').classList.add('on');document.body.style.overflow='hidden';const n=document.getElementById('lbn');
 const f=()=>{n.textContent=(Math.round(sc.scrollLeft/sc.clientWidth)+1)+' / '+r.ph.length};sc.onscroll=f;requestAnimationFrame(()=>{sc.scrollLeft=i*sc.clientWidth;f()})}
document.getElementById('lbx').onclick=()=>{document.getElementById('lb').classList.remove('on');document.body.style.overflow=''};
const sm=u=>u.includes('zillowstatic')?u+'-se_medium_500_250.webp':u, big=u=>u.includes('zillowstatic')?u+'-se_extra_large_1500_800.webp':u;
let edit=false,lastDel=null,sel=null;
function fullOrder(){const ord=S.orders.all||[...(S.orders.pool||[]),...(S.orders.nopool||[])];const pos=Object.fromEntries(ord.map((id,i)=>[id,i]));
 const isN=r=>r.new&&!(S.seen||[]).includes(r.id);let L=[...D.filter(isN),...D.filter(r=>!isN(r))];if(ord.length)L.sort((a,b)=>(pos[a.id]??-1)-(pos[b.id]??-1));return L.map(r=>r.id)}
function selectCard(c){document.querySelectorAll('.card.sel').forEach(x=>x.classList.remove('sel'));c.classList.add('sel');sel=+c.dataset.id;edit=true;document.body.classList.add('edit');if(navigator.vibrate)navigator.vibrate(12)}
function clearSel(){document.querySelectorAll('.card.sel').forEach(x=>x.classList.remove('sel'));sel=null;edit=false;document.body.classList.remove('edit')}
document.addEventListener('pointerdown',e=>{if(sel==null)return;const c=e.target.closest('.card');if(!c||+c.dataset.id!==sel)clearSel()},true);
function setEdit(v){edit=v;document.body.classList.toggle('edit',v);if(v&&navigator.vibrate)navigator.vibrate(15);render()}

document.getElementById('undo').onclick=()=>{if(!lastDel)return;const {id,wasStar,pos}=lastDel;S.hidden=(S.hidden||[]).filter(x=>x!==id);if(wasStar){S.stars.splice(Math.max(0,pos),0,id)}push();render();document.getElementById('toast').classList.remove('on');lastDel=null};
(()=>{let tm=null,sx=0,sy=0;const L=document.getElementById('list');
 const start=e=>{return;const c=e.target.closest('.card');if(!c||e.target.closest('a,button,.strip'))return;const p=e.touches?e.touches[0]:e;sx=p.clientX;sy=p.clientY;clearTimeout(tm);tm=setTimeout(()=>{tm=null;selectCard(c)},420)};
 const move=e=>{if(!tm)return;const p=e.touches?e.touches[0]:e;if(Math.abs(p.clientX-sx)>8||Math.abs(p.clientY-sy)>8){clearTimeout(tm);tm=null}};
 const end=()=>{clearTimeout(tm);tm=null};
 L.addEventListener('touchstart',start,{passive:true});L.addEventListener('touchmove',move,{passive:true});L.addEventListener('touchend',end);L.addEventListener('touchcancel',end);
 L.addEventListener('mousedown',start);L.addEventListener('mousemove',move);L.addEventListener('mouseup',end);
 L.addEventListener('contextmenu',e=>{if(e.target.closest('.card'))e.preventDefault()});})();

(()=>{const LST=document.getElementById('list');let tm=null,st=null,drag=null,raf=null;
 const pt=e=>e.touches?e.touches[0]:e;
 function begin(card,x,y){const cards=[...LST.querySelectorAll('.card')];const from=cards.indexOf(card);if(from<0)return;
  const sy=scrollY;const R=cards.map(c=>{const r=c.getBoundingClientRect();return {top:r.top+sy,h:r.height}});
  const gap=R.length>1?Math.max(0,R[1].top-(R[0].top+R[0].h)):8;
  drag={card,cards,from,to:from,R,gap,y0:y,sy0:sy,lastY:y};selectCard(card);card.classList.add('lift');
  cards.forEach(c=>{if(c!==card)c.classList.add('shift')});document.body.classList.add('dragging-on');if(navigator.vibrate)navigator.vibrate(15);dragging=true;tick();}
 function update(){if(!drag)return;const d=drag;const dy=(d.lastY-d.y0)+(scrollY-d.sy0);
  d.card.style.transform=`translateY(${dy}px) scale(1.03)`;
  const c=d.R[d.from].top+d.R[d.from].h/2+dy;let to=d.from;
  for(let i=d.from+1;i<d.R.length;i++){if(c>d.R[i].top+d.R[i].h/2)to=i;}
  for(let i=d.from-1;i>=0;i--){if(c<d.R[i].top+d.R[i].h/2)to=i;}
  d.to=to;const sh=d.R[d.from].h+d.gap;
  d.cards.forEach((el,i)=>{if(el===d.card)return;let ty=0;if(d.from<to&&i>d.from&&i<=to)ty=-sh;else if(to<d.from&&i>=to&&i<d.from)ty=sh;el.style.transform=ty?`translateY(${ty}px)`:''});}
 function tick(){if(!drag)return;const y=drag.lastY,H=innerHeight;let v=0;if(y<90)v=-Math.ceil((90-y)/6);else if(y>H-90)v=Math.ceil((y-(H-90))/6);if(v)scrollBy(0,v);update();raf=requestAnimationFrame(tick)}
 function finish(){if(!drag)return;cancelAnimationFrame(raf);const d=drag;drag=null;
  let target=d.R[d.from].top;if(d.to>d.from)target=d.R[d.to].top+d.R[d.to].h-d.R[d.from].h;else if(d.to<d.from)target=d.R[d.to].top;
  d.card.style.transition='transform .2s cubic-bezier(.2,.8,.2,1)';d.card.style.transform=`translateY(${target-d.R[d.from].top}px)`;
  setTimeout(()=>{document.body.classList.remove('dragging-on');dragging=false;
   const ids=d.cards.map(c=>+c.dataset.id);const [m]=ids.splice(d.from,1);ids.splice(d.to,0,m);
   if(d.to!==d.from){if(tab==='top'){const rest=S.stars.filter(x=>!ids.includes(x));S.stars=[...ids,...rest]}else{const base=fullOrder();const set=new Set(ids);let k=0;S.orders.all=base.map(x=>set.has(x)?ids[k++]:x)}push();}
   render();const c=LST.querySelector(`.card[data-id="${m}"]`);if(c)selectCard(c);},210);}
 function down(e){if(drag)return;const card=e.target.closest('.card');if(!card||e.target.closest('a,button,.strip,.del,.tour'))return;const p=pt(e);st={x:p.clientX,y:p.clientY,card};clearTimeout(tm);
  tm=setTimeout(()=>{tm=null;if(!st)return;if(window.canDrag)begin(st.card,st.x,st.y);else selectCard(st.card)},340)}
 function move(e){const p=pt(e);if(drag){e.preventDefault();drag.lastY=p.clientY;return}if(tm&&st&&(Math.abs(p.clientX-st.x)>8||Math.abs(p.clientY-st.y)>8)){clearTimeout(tm);tm=null;st=null}}
 function up(){clearTimeout(tm);tm=null;st=null;if(drag)finish()}
 LST.addEventListener('touchstart',down,{passive:true});document.addEventListener('touchmove',move,{passive:false});document.addEventListener('touchend',up);document.addEventListener('touchcancel',up);
 LST.addEventListener('mousedown',down);document.addEventListener('mousemove',move);document.addEventListener('mouseup',up);
 LST.addEventListener('contextmenu',e=>{if(e.target.closest('.card'))e.preventDefault()});})();
render();pull();setInterval(pull,5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
</script></body></html>

function tourBtn(r){const tr=(S.tours||{})[r.id];const nm=r.listing[0].split(',')[0];
 const body=encodeURIComponent(`Tour request: ${nm} (${r.rent}) ${r.url||''}\nTimes that work: `);
 return tr?`<a class="tour req" data-tour="${r.id}" href="sms:+15303064813&body=${body}">Tour requested ${new Date(tr).toLocaleDateString(undefined,{month:'short',day:'numeric'})} · ask again</a>`:`<a class="tour" data-tour="${r.id}" href="sms:+15303064813&body=${body}">Request tour</a>`}
function card(r,i){const take=r.type.some(t=>/takeover/i.test(t));const on=S.stars.includes(r.id);
 const chips=r.notes.filter(n=>n.length<40).map(n=>`<span class="chip ${/pool/i.test(n)?'p':/gym|fitness/i.test(n)?'g':/roof/i.test(n)?'y':''}">${esc(n.replace(/^Swimming pool/,'Pool').replace(/^Heated indoor pool/,'Heated indoor pool'))}</span>`).join('');
 const m=r.rent.match(/^\$[\d,]+/);const main=m?m[0]:r.rent;const free=(r.rent.match(/[\d.]+ mo free/)||[''])[0];const net=(r.rent.match(/net \$[\d,]+/)||[''])[0];
 const sqft=(r.size.match(/\d+ sf/)||[''])[0];const bd=r.size.split(' ')[0];
 const bldg=(r.listing[1]||'').split(',')[0];const how=s=>esc(s.replace(/^\d+ min ?/,''));
 const lease=r.type.slice(1).filter(t=>!/StreetEasy/.test(t)).map(esc).join(' · ');
 const notes=r.mine?`<ul class="n">${r.mine.split(/\.\s+/).map(s=>s.replace(/\.$/,'').trim()).filter(Boolean).map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`:'';
 return `<div class="card" data-id="${r.id}"><button class="del" data-del="${r.id}">✕</button><div class="r1">${tab==='top'?`<div class="num">${i+1}</div>`:''}<div class="ttl"><div class="name">${esc(r.listing[0].replace(/, 1bd.*$/,''))}${take?'<span class="tag">TAKEOVER</span>':''}${(r.new&&!(S.seen||[]).includes(r.id))?'<span class="tag nw" style="color:#30d158;border-color:#30d158">NEW</span>':''}</div>

 <div class="cm"><div class="c"><span class="l">Allan</span><b>${r.amin} min</b><div class="h">${how(r.allan)}</div></div><div class="c"><span class="l">Eliza</span><b>${r.emin} min</b><div class="h">${how(r.eliza)}</div></div><div class="c"><span class="l">Train</span><b>${esc((r.train.match(/^\d+/)||['?'])[0])} min</b><div class="h">${how(r.train)}</div></div></div>

 if(_o){const pos=Object.fromEntries(_o.map((id,i)=>[id,i]));L.sort((a,b)=>(pos[a.id]??-1)-(pos[b.id]??-1));}return L;}
function render(){let L=list();const nk=r=>r.new?((S.seen||[]).includes(r.id)?1:0)-Date.parse(r.new+' 2026')/1e13:2;const val=(r,k)=>k==='newk'?nk(r):r[k];if(sort!=='mine')L=[...L].sort((a,b)=>(val(a,sort)-val(b,sort))*dir);
 const el=document.getElementById('list');const sh=document.getElementById('showing');if(F.size){const tot=(tab==='top'?S.stars.filter(id=>byId[id]&&!(S.hidden||[]).includes(id)).length:D.filter(r=>!(S.hidden||[]).includes(r.id)).length);sh.style.display='flex';sh.innerHTML=`<span style='flex:1'>Showing ${L.length} of ${tot} · ${[...F].map(i=>FILTERS[i][0]).join(', ')}</span><button class='lnk' id='shclr' style='font-size:12px'>Clear</button>`;document.getElementById('shclr').onclick=()=>{F.clear();render()}}else sh.style.display='none';el.innerHTML=L.length?L.map(card).join(''):'<div class="empty">No favorites yet. Tap ☆ on a listing.</div>';
 document.getElementById('hint').innerHTML=sort==='mine'?'Hold a card to drag it, or tap its ✕ to delete. Syncs for both of you.'+' <button class="lnk" id="rs">Reset</button>':'Sorted view. Choose Default in Sort to drag.';
 const rs=document.getElementById('rs');if(rs)rs.onclick=()=>{if(!confirm('Reset this list order for both of you?'))return;if(tab==='top')S.stars=defStars();else {delete S.orders.all;delete S.orders.pool;delete S.orders.nopool;}push();render()};
 const markSeen=id=>{S.seen=S.seen||[];if(byId[id]&&byId[id].new&&!S.seen.includes(id)){S.seen.push(id);clearTimeout(pending);pending=null;
  fetch(SB+'?key=eq.'+ROW,{method:'PATCH',keepalive:true,headers:{...H,Prefer:'return=representation'},body:JSON.stringify({data:S,updated_at:new Date().toISOString()})}).then(r=>r.json()).then(j=>{ver=j[0]&&j[0].updated_at}).catch(()=>{});
  const c=el.querySelector(`.card[data-id="${id}"] .tag.nw`);if(c)c.remove();}};
 el.querySelectorAll('[data-go]').forEach(a=>{a.addEventListener('pointerdown',()=>markSeen(+a.dataset.go));a.addEventListener('click',()=>markSeen(+a.dataset.go))});
 el.querySelectorAll('[data-ph]').forEach(b=>b.addEventListener('click',()=>markSeen(+b.dataset.ph)));
 el.querySelectorAll('[data-star]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=+b.dataset.star;S.stars=S.stars.includes(id)?S.stars.filter(x=>x!==id):[...S.stars,id];push();render()});
 el.querySelectorAll('[data-ph]').forEach(b=>{const id=+b.dataset.ph,s=document.getElementById('s'+id),r=byId[id];
  const fill=()=>{if(!s.childElementCount)s.innerHTML=r.ph.map((u,i)=>`<img loading="lazy" src="${sm(u)}" data-i="${i}">`).join('');s.querySelectorAll('img').forEach(im=>im.onclick=()=>lbOpen(id,+im.dataset.i))};
  if(open[id]){fill();s.classList.add('on');b.textContent=`Photos (${r.ph.length}) ▴`}
  b.onclick=e=>{e.stopPropagation();open[id]=!open[id];if(open[id])fill();s.classList.toggle('on',!!open[id]);b.textContent=`Photos (${r.ph.length}) ${open[id]?'▴':'▾'}`}});
{const hid=S.hidden||[];document.getElementById('ca').textContent=D.filter(r=>!hid.includes(r.id)).length;const n=F.size;document.getElementById('filtlbl').textContent=n?n+' on':'None';document.getElementById('filtbtn').style.borderColor=n?'var(--acc)':''}
 el.querySelectorAll('[data-tour]').forEach(b=>b.addEventListener('click',()=>{const id=+b.dataset.tour;S.tours=S.tours||{};S.tours[id]=Date.now();
  fetch(SB+'?key=eq.'+ROW,{method:'PATCH',keepalive:true,headers:{...H,Prefer:'return=representation'},body:JSON.stringify({data:S,updated_at:new Date().toISOString()})}).then(r=>r.json()).then(j=>{ver=j[0]&&j[0].updated_at}).catch(()=>{});setTimeout(render,800)}));
 el.querySelectorAll('[data-del]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=+b.dataset.del;S.hidden=S.hidden||[];if(!S.hidden.includes(id))S.hidden.push(id);lastDel={id,wasStar:S.stars.includes(id),pos:S.stars.indexOf(id)};S.stars=S.stars.filter(x=>x!==id);clearSel();push();render();
  const nm=byId[id].listing[0].split(',')[0];document.getElementById('toastt').textContent='Deleted '+nm.slice(0,26);const tt=document.getElementById('toast');tt.classList.add('on');clearTimeout(window.tto);window.tto=setTimeout(()=>tt.classList.remove('on'),6000)});
 if(window.srt){window.srt.destroy();window.srt=null}
 window.canDrag=(sort==='mine'&&L.length>1);}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b));render();scrollTo(0,0)});
const hay=r=>(r.notes.join(' ')+' '+(r.mine||'')+' '+r.listing.join(' ')+' '+r.type.join(' ')).toLowerCase();
const FILTERS=[['Indoor pool',r=>r.pin],['Outdoor pool',r=>r.pout],['Gym',r=>/gym|fitness/.test(hay(r))],['Private outdoor',r=>/balcony|terrace|private outdoor|outdoor space/.test(hay(r))],['Roof deck',r=>/roof/.test(hay(r))],['Hot tub',r=>/hot tub|jacuzzi|spa\b/.test(hay(r))],['Sauna',r=>/sauna|steam room/.test(hay(r))],['Doorman',r=>/doorman|concierge/.test(hay(r))],['Loft / high ceilings',r=>/loft|ceiling|beamed|warehouse/.test(hay(r))],['Takeover',r=>/takeover|assignment|sublease|transfer/.test(hay(r))],['1 bed',r=>/^1/.test(r.size)],['2 bed',r=>/^2/.test(r.size)],['Under $5.5k',r=>r.rnum<=5500],['New',r=>r.new&&!(S.seen||[]).includes(r.id)]];
const F=new Set();const passF=r=>[...F].every(i=>FILTERS[i][1](r));
function drawF(){const hid=S.hidden||[];document.getElementById('fchips').innerHTML=FILTERS.map(([l,f],i)=>`<button class="fc ${F.has(i)?'on':''}" data-f="${i}">${l}<span>${D.filter(r=>!hid.includes(r.id)&&f(r)).length}</span></button>`).join('');
 document.querySelectorAll('.fc').forEach(b=>b.onclick=()=>{const i=+b.dataset.f;F.has(i)?F.delete(i):F.add(i);drawF();render()})}

const SORTS=[['mine','Default'],['newk','New'],['amin','Allan commute'],['emin','Eliza commute'],['rnum','Rent'],['tmin','Walk to train']];
function drawSheet(){document.getElementById('opts').innerHTML=SORTS.map(([k,l])=>`<button class="opt ${k===sort?'on':''}" data-k="${k}">${l}</button>`).join('');
 document.getElementById('d1').textContent=sort==='newk'?'Newest first':'Low → High';document.getElementById('d2').textContent=sort==='newk'?'Oldest first':'High → Low';
 document.querySelectorAll('.dir button').forEach(b=>{b.disabled=sort==='mine';b.classList.toggle('on',sort!=='mine'&&+b.dataset.d===dir)});
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{sort=b.dataset.k;drawSheet();upd()})}

document.getElementById('sortbtn').onclick=()=>{drawSheet();document.getElementById('sheet').classList.add('on')};
document.getElementById('sheet').onclick=e=>{if(e.target.id==='sheet')e.currentTarget.classList.remove('on')};
document.querySelectorAll('.dir button').forEach(b=>b.onclick=()=>{dir=+b.dataset.d;drawSheet();upd();document.getElementById('sheet').classList.remove('on')});
const open={};
function lbOpen(id,i){const r=byId[id];const sc=document.getElementById('lbsc');sc.innerHTML=r.ph.map(u=>`<div><img loading="lazy" src="${big(u)}"></div>`).join('');
 document.getElementById('lb').classList.add('on');document.body.style.overflow='hidden';const n=document.getElementById('lbn');
 const f=()=>{n.textContent=(Math.round(sc.scrollLeft/sc.clientWidth)+1)+' / '+r.ph.length};sc.onscroll=f;requestAnimationFrame(()=>{sc.scrollLeft=i*sc.clientWidth;f()})}

const sm=u=>u.includes('zillowstatic')?u+'-se_medium_500_250.webp':u, big=u=>u.includes('zillowstatic')?u+'-se_extra_large_1500_800.webp':u;
let edit=false,lastDel=null,sel=null;
function fullOrder(){const ord=S.orders.all||[...(S.orders.pool||[]),...(S.orders.nopool||[])];const pos=Object.fromEntries(ord.map((id,i)=>[id,i]));
 const isN=r=>r.new&&!(S.seen||[]).includes(r.id);let L=[...D.filter(isN),...D.filter(r=>!isN(r))];if(ord.length)L.sort((a,b)=>(pos[a.id]??-1)-(pos[b.id]??-1));return L.map(r=>r.id)}
function selectCard(c){document.querySelectorAll('.card.sel').forEach(x=>x.classList.remove('sel'));c.classList.add('sel');sel=+c.dataset.id;edit=true;document.body.classList.add('edit');if(navigator.vibrate)navigator.vibrate(12)}

(()=>{let tm=null,sx=0,sy=0;const L=document.getElementById('list');
 const start=e=>{return;const c=e.target.closest('.card');if(!c||e.target.closest('a,button,.strip'))return;const p=e.touches?e.touches[0]:e;sx=p.clientX;sy=p.clientY;clearTimeout(tm);tm=setTimeout(()=>{tm=null;selectCard(c)},420)};
 const move=e=>{if(!tm)return;const p=e.touches?e.touches[0]:e;if(Math.abs(p.clientX-sx)>8||Math.abs(p.clientY-sy)>8){clearTimeout(tm);tm=null}};
 const end=()=>{clearTimeout(tm);tm=null};
 L.addEventListener('touchstart',start,{passive:true});L.addEventListener('touchmove',move,{passive:true});L.addEventListener('touchend',end);L.addEventListener('touchcancel',end);

(()=>{const LST=document.getElementById('list');let tm=null,st=null,drag=null,raf=null;
 const pt=e=>e.touches?e.touches[0]:e;
 function begin(card,x,y){const cards=[...LST.querySelectorAll('.card')];const from=cards.indexOf(card);if(from<0)return;
  const sy=scrollY;const R=cards.map(c=>{const r=c.getBoundingClientRect();return {top:r.top+sy,h:r.height}});
  const gap=R.length>1?Math.max(0,R[1].top-(R[0].top+R[0].h)):8;
  drag={card,cards,from,to:from,R,gap,y0:y,sy0:sy,lastY:y};selectCard(card);card.classList.add('lift');
  cards.forEach(c=>{if(c!==card)c.classList.add('shift')});document.body.classList.add('dragging-on');if(navigator.vibrate)navigator.vibrate(15);dragging=true;tick();}
 function update(){if(!drag)return;const d=drag;const dy=(d.lastY-d.y0)+(scrollY-d.sy0);
  d.card.style.transform=`translateY(${dy}px) scale(1.03)`;
  const c=d.R[d.from].top+d.R[d.from].h/2+dy;let to=d.from;
  for(let i=d.from+1;i<d.R.length;i++){if(c>d.R[i].top+d.R[i].h/2)to=i;}
  for(let i=d.from-1;i>=0;i--){if(c<d.R[i].top+d.R[i].h/2)to=i;}
  d.to=to;const sh=d.R[d.from].h+d.gap;
  d.cards.forEach((el,i)=>{if(el===d.card)return;let ty=0;if(d.from<to&&i>d.from&&i<=to)ty=-sh;else if(to<d.from&&i>=to&&i<d.from)ty=sh;el.style.transform=ty?`translateY(${ty}px)`:''});}
 function tick(){if(!drag)return;const y=drag.lastY,H=innerHeight;let v=0;if(y<90)v=-Math.ceil((90-y)/6);else if(y>H-90)v=Math.ceil((y-(H-90))/6);if(v)scrollBy(0,v);update();raf=requestAnimationFrame(tick)}
 function finish(){if(!drag)return;cancelAnimationFrame(raf);const d=drag;drag=null;
  let target=d.R[d.from].top;if(d.to>d.from)target=d.R[d.to].top+d.R[d.to].h-d.R[d.from].h;else if(d.to<d.from)target=d.R[d.to].top;
  d.card.style.transition='transform .2s cubic-bezier(.2,.8,.2,1)';d.card.style.transform=`translateY(${target-d.R[d.from].top}px)`;
  setTimeout(()=>{document.body.classList.remove('dragging-on');dragging=false;
   const ids=d.cards.map(c=>+c.dataset.id);const [m]=ids.splice(d.from,1);ids.splice(d.to,0,m);
   if(d.to!==d.from){if(tab==='top'){const rest=S.stars.filter(x=>!ids.includes(x));S.stars=[...ids,...rest]}else{const base=fullOrder();const set=new Set(ids);let k=0;S.orders.all=base.map(x=>set.has(x)?ids[k++]:x)}push();}
   render();const c=LST.querySelector(`.card[data-id="${m}"]`);if(c)selectCard(c);},210);}
 function down(e){if(drag)return;const card=e.target.closest('.card');if(!card||e.target.closest('a,button,.strip,.del,.tour'))return;const p=pt(e);st={x:p.clientX,y:p.clientY,card};clearTimeout(tm);
  tm=setTimeout(()=>{tm=null;if(!st)return;if(window.canDrag)begin(st.card,st.x,st.y);else selectCard(st.card)},340)}
 function move(e){const p=pt(e);if(drag){e.preventDefault();drag.lastY=p.clientY;return}if(tm&&st&&(Math.abs(p.clientX-st.x)>8||Math.abs(p.clientY-st.y)>8)){clearTimeout(tm);tm=null;st=null}}
 function up(){clearTimeout(tm);tm=null;st=null;if(drag)finish()}
 LST.addEventListener('touchstart',down,{passive:true});document.addEventListener('touchmove',move,{passive:false});document.addEventListener('touchend',up);document.addEventListener('touchcancel',up);
 LST.addEventListener('mousedown',down);document.addEventListener('mousemove',move);document.addEventListener('mouseup',up);
 LST.addEventListener('contextmenu',e=>{if(e.target.closest('.card'))e.preventDefault()});})();
render();pull();setInterval(pull,5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
</script></body></html>

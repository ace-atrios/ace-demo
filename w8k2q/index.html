*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{overflow-x:hidden;margin:0;font:14px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;background:var(--bg);color:var(--t);padding-bottom:30px}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:10px 12px 8px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.4px}
.sync{font-size:11px;color:var(--m);display:flex;align-items:center;gap:5px}.dot{width:7px;height:7px;border-radius:50%;background:#30d158}
.seg{display:flex;background:var(--chip);border-radius:9px;padding:2px;margin-top:8px}
.seg button{flex:1;border:0;background:transparent;color:var(--t);font:600 13px -apple-system,system-ui;padding:6px 4px;border-radius:7px}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.sorts{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.sorts button{flex:none;border:1px solid var(--line);background:transparent;color:var(--m);border-radius:14px;padding:4px 10px;font-size:12px}
.sorts button.on{color:var(--t);border-color:var(--t)}
.hint{font-size:11px;color:var(--m);padding:6px 14px 0}
main{padding:2px 10px}
.card{background:var(--card);border-radius:14px;padding:10px 12px;margin:8px 0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;border:1px solid var(--line)}
.ghost{opacity:.3}.chosen{box-shadow:0 10px 30px rgba(0,0,0,.3)}
.r1{display:flex;gap:8px;align-items:flex-start}
.num{flex:none;width:20px;height:20px;border-radius:50%;background:var(--t);color:var(--card);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.ttl{flex:1;min-width:0}.name{font-weight:650;font-size:15px;letter-spacing:-.2px}.sub{font-size:12px;color:var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{text-align:right;flex:none}.price b{font-size:16px;letter-spacing:-.3px}.price div{font-size:11px;color:var(--m)}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.3px;color:var(--acc);border:1px solid var(--acc);border-radius:5px;padding:0 4px;margin-left:4px;vertical-align:2px}
.cm{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:8px 0 6px}
.c{min-width:0;background:var(--soft);border-radius:9px;padding:5px 7px}.c .l{font-size:10px;color:var(--m);text-transform:uppercase;letter-spacing:.4px}.c b{font-size:15px;display:block}.c .h{font-size:10.5px;color:var(--m);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;gap:4px}.chip{font-size:11px;background:var(--chip);border-radius:6px;padding:2px 6px;color:var(--t)}.chip.p{background:var(--acc);color:#fff}
.meta{font-size:11px;color:var(--m);margin-top:5px}
ul.n{margin:6px 0 0;padding-left:16px;font-size:12px}ul.n li{margin:1px 0}
.act{display:flex;gap:6px;margin-top:8px}.go{flex:1;text-align:center;background:var(--t);color:var(--card);text-decoration:none;border-radius:9px;padding:7px;font-weight:600;font-size:13px}

.sortbtn{display:flex;align-items:center;gap:6px;margin-top:8px;border:1px solid var(--line);background:var(--card);color:var(--t);border-radius:10px;padding:6px 10px;font:600 13px -apple-system,system-ui}
.sortbtn span{color:var(--m);font-weight:500}

.opt.on{font-weight:700}.opt.on::after{content:"✓";color:var(--acc)}

.phb{flex:1;border:1px solid var(--line);background:transparent;color:var(--t);border-radius:9px;font:600 13px -apple-system,system-ui}

.strip img{flex:none;height:120px;width:170px;object-fit:cover;border-radius:9px;scroll-snap-align:start;background:var(--soft)}

.lb .sc img{max-width:100%;max-height:100%;object-fit:contain}
@keyframes jig{0%{transform:rotate(-.6deg)}50%{transform:rotate(.6deg)}100%{transform:rotate(-.6deg)}}
body.edit .card{animation:jig .28s infinite ease-in-out;position:relative}body.edit .card:nth-child(2n){animation-delay:-.14s}
.del{display:none;position:absolute;top:-7px;left:-7px;width:26px;height:26px;border-radius:50%;border:0;background:#ff3b30;color:#fff;font:700 15px -apple-system,system-ui;line-height:26px;z-index:3;box-shadow:0 2px 6px rgba(0,0,0,.3)}
body.edit .del{display:block}.card{position:relative}

.tour{display:block;width:100%;margin-top:6px;text-align:center;border:1px solid var(--acc);color:var(--acc);background:transparent;border-radius:9px;padding:7px;font:600 13px -apple-system,system-ui;text-decoration:none}

.empty{color:var(--m);text-align:center;margin:30px}.lnk{background:none;border:0;color:var(--acc);font-size:11px;padding:0}

 if(j[0].updated_at!==ver&&!dragging&&!pending){ver=j[0].updated_at;const d=j[0].data||{};if(d.stars){S={stars:d.stars,orders:d.orders||{},seen:d.seen||[],hidden:d.hidden||[],tours:d.tours||{}};render()}}setSync('Synced',true)}catch(e){setSync('Offline',false)}}
function push(){setSync('Saving…',false);clearTimeout(pending);pending=setTimeout(async()=>{try{const r=await fetch(SB+'?key=eq.'+ROW,{method:'PATCH',headers:{...H,Prefer:'return=representation'},body:JSON.stringify({data:S,updated_at:new Date().toISOString()})});const j=await r.json();ver=j[0]&&j[0].updated_at;setSync('Synced',true)}catch(e){setSync('Not saved',false)}pending=null},300)}
function tourBtn(r){const tr=(S.tours||{})[r.id];const nm=r.listing[0].split(',')[0];
 const body=encodeURIComponent(`Tour request: ${nm} (${r.rent}) ${r.url||''}\nTimes that work: `);
 return tr?`<a class="tour req" data-tour="${r.id}" href="sms:+15303064813&body=${body}">Tour requested ${new Date(tr).toLocaleDateString(undefined,{month:'short',day:'numeric'})} · ask again</a>`:`<a class="tour" data-tour="${r.id}" href="sms:+15303064813&body=${body}">Request tour</a>`}
function card(r,i){const take=r.type.some(t=>/takeover/i.test(t));const on=S.stars.includes(r.id);
 const chips=r.notes.filter(n=>n.length<40).map(n=>`<span class="chip ${/pool/i.test(n)?'p':''}">${esc(n.replace(/^Swimming pool/,'Pool').replace(/^Heated indoor pool/,'Heated indoor pool'))}</span>`).join('');
 const m=r.rent.match(/^\$[\d,]+/);const main=m?m[0]:r.rent;const free=(r.rent.match(/[\d.]+ mo free/)||[''])[0];const net=(r.rent.match(/net \$[\d,]+/)||[''])[0];
 const sqft=(r.size.match(/\d+ sf/)||[''])[0];const bd=r.size.split(' ')[0];
 const bldg=(r.listing[1]||'').split(',')[0];const how=s=>esc(s.replace(/^\d+ min ?/,''));
 const lease=r.type.slice(1).filter(t=>!/StreetEasy/.test(t)).map(esc).join(' · ');
 const notes=r.mine?`<ul class="n">${r.mine.split(/\.\s+/).map(s=>s.replace(/\.$/,'').trim()).filter(Boolean).map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`:'';
 return `<div class="card" data-id="${r.id}"><button class="del" data-del="${r.id}">✕</button><div class="r1">${tab==='top'?`<div class="num">${i+1}</div>`:''}<div class="ttl"><div class="name">${esc(r.listing[0].replace(/, 1bd.*$/,''))}${take?'<span class="tag">TAKEOVER</span>':''}${(r.new&&!(S.seen||[]).includes(r.id))?'<span class="tag nw" style="color:#30d158;border-color:#30d158">NEW</span>':''}</div>
 <div class="sub">${esc(bldg)}${bldg?' · ':''}${esc(r.hood)}</div></div><div class="price"><b>${esc(main)}</b><div>${esc(bd)}${sqft?' · '+sqft:''}</div>${free||net?`<div>${esc([free,net].filter(Boolean).join(' · '))}</div>`:''}</div></div>
 <div class="cm"><div class="c"><span class="l">Allan</span><b>${r.amin} min</b><div class="h">${how(r.allan)}</div></div><div class="c"><span class="l">Eliza</span><b>${r.emin} min</b><div class="h">${how(r.eliza)}</div></div><div class="c"><span class="l">Train</span><b>${esc((r.train.match(/^\d+/)||['?'])[0])} min</b><div class="h">${how(r.train)}</div></div></div>
 <div class="chips">${chips}</div>${lease?`<div class="meta">${lease}</div>`:''}${notes}
 ${r.ph&&r.ph.length?`<div class="strip" id="s${r.id}"></div>`:''}<div class="act">${r.ph&&r.ph.length?`<button class="phb" data-ph="${r.id}">Photos (${r.ph.length}) ▾</button>`:''}${r.url?`<a class="go" data-go="${r.id}" href="${r.url}" target="_blank" rel="noopener">View listing</a>`:''}<button class="st ${on?'on':''}" data-star="${r.id}">${on?'★':'☆'}</button></div>${tourBtn(r)}</div>`}
function list(){const hid=S.hidden||[];if(tab==='top')return S.stars.map(id=>byId[id]).filter(r=>r&&!hid.includes(r.id)&&passF(r));
 let L=D.filter(r=>!hid.includes(r.id)&&passF(r));const isN=r=>r.new&&!(S.seen||[]).includes(r.id);L=[...L.filter(isN),...L.filter(r=>!isN(r))];const ord=S.orders.all||[...(S.orders.pool||[]),...(S.orders.nopool||[])];const _o=ord.length?ord:null;
 if(_o){const pos=Object.fromEntries(_o.map((id,i)=>[id,i]));L.sort((a,b)=>(pos[a.id]??-1)-(pos[b.id]??-1));}return L;}
function render(){let L=list();const nk=r=>r.new?((S.seen||[]).includes(r.id)?1:0)-Date.parse(r.new+' 2026')/1e13:2;const val=(r,k)=>k==='newk'?nk(r):r[k];if(sort!=='mine')L=[...L].sort((a,b)=>(val(a,sort)-val(b,sort))*dir);
 const el=document.getElementById('list');el.innerHTML=L.length?L.map(card).join(''):'<div class="empty">No favorites yet. Tap ☆ on a listing.</div>';
 document.getElementById('hint').innerHTML=sort==='mine'?(edit?'Drag to reorder. Tap ✕ to delete. Tap Done when finished.':'Hold a card to move or delete. Syncs for both of you.')+' <button class="lnk" id="rs">Reset</button>':'Sorted view. Choose "Our order" in Sort to drag.';
 const rs=document.getElementById('rs');if(rs)rs.onclick=()=>{if(!confirm('Reset this list order for both of you?'))return;if(tab==='top')S.stars=defStars();else {delete S.orders.all;delete S.orders.pool;delete S.orders.nopool;}push();render()};
 const markSeen=id=>{S.seen=S.seen||[];if(byId[id]&&byId[id].new&&!S.seen.includes(id)){S.seen.push(id);clearTimeout(pending);pending=null;
  fetch(SB+'?key=eq.'+ROW,{method:'PATCH',keepalive:true,headers:{...H,Prefer:'return=representation'},body:JSON.stringify({data:S,updated_at:new Date().toISOString()})}).then(r=>r.json()).then(j=>{ver=j[0]&&j[0].updated_at}).catch(()=>{});
  const c=el.querySelector(`.card[data-id="${id}"] .tag.nw`);if(c)c.remove();}};
 el.querySelectorAll('[data-go]').forEach(a=>{a.addEventListener('pointerdown',()=>markSeen(+a.dataset.go));a.addEventListener('click',()=>markSeen(+a.dataset.go))});
 el.querySelectorAll('[data-ph]').forEach(b=>b.addEventListener('click',()=>markSeen(+b.dataset.ph)));
 el.querySelectorAll('[data-star]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=+b.dataset.star;S.stars=S.stars.includes(id)?S.stars.filter(x=>x!==id):[...S.stars,id];push();render()});
 el.querySelectorAll('[data-ph]').forEach(b=>{const id=+b.dataset.ph,s=document.getElementById('s'+id),r=byId[id];
  const fill=()=>{if(!s.childElementCount)s.innerHTML=r.ph.map((u,i)=>`<img loading="lazy" src="${sm(u)}" data-i="${i}">`).join('');s.querySelectorAll('img').forEach(im=>im.onclick=()=>lbOpen(id,+im.dataset.i))};
  if(open[id]){fill();s.classList.add('on');b.textContent=`Photos (${r.ph.length}) ▴`}
  b.onclick=e=>{e.stopPropagation();open[id]=!open[id];if(open[id])fill();s.classList.toggle('on',!!open[id]);b.textContent=`Photos (${r.ph.length}) ${open[id]?'▴':'▾'}`}});
{const hid=S.hidden||[];document.getElementById('ca').textContent=D.filter(r=>!hid.includes(r.id)).length;const n=F.size;document.getElementById('filtlbl').textContent=n?n+' on':'None';document.getElementById('filtbtn').style.borderColor=n?'var(--acc)':''}
 el.querySelectorAll('[data-tour]').forEach(b=>b.addEventListener('click',()=>{const id=+b.dataset.tour;S.tours=S.tours||{};S.tours[id]=Date.now();
  fetch(SB+'?key=eq.'+ROW,{method:'PATCH',keepalive:true,headers:{...H,Prefer:'return=representation'},body:JSON.stringify({data:S,updated_at:new Date().toISOString()})}).then(r=>r.json()).then(j=>{ver=j[0]&&j[0].updated_at}).catch(()=>{});setTimeout(render,800)}));
 el.querySelectorAll('[data-del]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=+b.dataset.del;S.hidden=S.hidden||[];if(!S.hidden.includes(id))S.hidden.push(id);lastDel={id,wasStar:S.stars.includes(id),pos:S.stars.indexOf(id)};S.stars=S.stars.filter(x=>x!==id);push();render();
  const nm=byId[id].listing[0].split(',')[0];document.getElementById('toastt').textContent='Deleted '+nm.slice(0,26);const tt=document.getElementById('toast');tt.classList.add('on');clearTimeout(window.tto);window.tto=setTimeout(()=>tt.classList.remove('on'),6000)});
 if(window.srt){window.srt.destroy();window.srt=null}
 if(edit&&sort==='mine'&&L.length>1&&window.Sortable)window.srt=Sortable.create(el,{animation:150,delay:120,delayOnTouchOnly:true,touchStartThreshold:8,ghostClass:'ghost',chosenClass:'chosen',filter:'a,button,.strip,.del,.tour',preventOnFilter:false,
  onStart:()=>dragging=true,onEnd:()=>{dragging=false;const ids=[...el.querySelectorAll('.card')].map(c=>+c.dataset.id);if(tab==='top'){const rest=S.stars.filter(x=>!ids.includes(x));S.stars=[...ids,...rest]}else{const full=list().map(r=>r.id);const others=full.filter(x=>!ids.includes(x));S.orders.all=[...ids,...others]}push();render()}});}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b));render();scrollTo(0,0)});
const hay=r=>(r.notes.join(' ')+' '+(r.mine||'')+' '+r.listing.join(' ')+' '+r.type.join(' ')).toLowerCase();
const FILTERS=[['Pool',r=>r.pool],['Gym',r=>/gym|fitness/.test(hay(r))],['Private outdoor',r=>/balcony|terrace|private outdoor|outdoor space/.test(hay(r))],['Roof deck',r=>/roof/.test(hay(r))],['Hot tub',r=>/hot tub|jacuzzi|spa\b/.test(hay(r))],['Sauna',r=>/sauna|steam room/.test(hay(r))],['Doorman',r=>/doorman|concierge/.test(hay(r))],['Loft / high ceilings',r=>/loft|ceiling|beamed|warehouse/.test(hay(r))],['Takeover',r=>/takeover|assignment|sublease|transfer/.test(hay(r))],['2 bed',r=>/^2/.test(r.size)],['Under $5.5k',r=>r.rnum<=5500],['New',r=>r.new&&!(S.seen||[]).includes(r.id)]];
const F=new Set();const passF=r=>[...F].every(i=>FILTERS[i][1](r));
function drawF(){const hid=S.hidden||[];document.getElementById('fchips').innerHTML=FILTERS.map(([l,f],i)=>`<button class="fc ${F.has(i)?'on':''}" data-f="${i}">${l}<span>${D.filter(r=>!hid.includes(r.id)&&f(r)).length}</span></button>`).join('');
 document.querySelectorAll('.fc').forEach(b=>b.onclick=()=>{const i=+b.dataset.f;F.has(i)?F.delete(i):F.add(i);drawF();render()})}
document.getElementById('filtbtn').onclick=()=>{drawF();document.getElementById('fsheet').classList.add('on')};
document.getElementById('fsheet').onclick=e=>{if(e.target.id==='fsheet')e.currentTarget.classList.remove('on')};
document.getElementById('fdone').onclick=()=>document.getElementById('fsheet').classList.remove('on');
document.getElementById('fclear').onclick=()=>{F.clear();drawF();render()};
const SORTS=[['mine','Our order'],['newk','New'],['amin','Allan commute'],['emin','Eliza commute'],['rnum','Rent'],['tmin','Walk to train']];
function drawSheet(){document.getElementById('opts').innerHTML=SORTS.map(([k,l])=>`<button class="opt ${k===sort?'on':''}" data-k="${k}">${l}</button>`).join('');
 document.getElementById('d1').textContent=sort==='newk'?'Newest first':'Low → High';document.getElementById('d2').textContent=sort==='newk'?'Oldest first':'High → Low';
 document.querySelectorAll('.dir button').forEach(b=>{b.disabled=sort==='mine';b.classList.toggle('on',sort!=='mine'&&+b.dataset.d===dir)});
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{sort=b.dataset.k;drawSheet();upd()})}
function upd(){const l=SORTS.find(s=>s[0]===sort)[1];document.getElementById('sortlbl').textContent=sort==='mine'?l:sort==='newk'?(dir>0?'Newest':'Oldest'):l+(dir>0?' ↑':' ↓');render()}
document.getElementById('sortbtn').onclick=()=>{drawSheet();document.getElementById('sheet').classList.add('on')};
document.getElementById('sheet').onclick=e=>{if(e.target.id==='sheet')e.currentTarget.classList.remove('on')};
document.querySelectorAll('.dir button').forEach(b=>b.onclick=()=>{dir=+b.dataset.d;drawSheet();upd();document.getElementById('sheet').classList.remove('on')});
const open={};
function lbOpen(id,i){const r=byId[id];const sc=document.getElementById('lbsc');sc.innerHTML=r.ph.map(u=>`<div><img loading="lazy" src="${big(u)}"></div>`).join('');
 document.getElementById('lb').classList.add('on');document.body.style.overflow='hidden';const n=document.getElementById('lbn');
 const f=()=>{n.textContent=(Math.round(sc.scrollLeft/sc.clientWidth)+1)+' / '+r.ph.length};sc.onscroll=f;requestAnimationFrame(()=>{sc.scrollLeft=i*sc.clientWidth;f()})}
document.getElementById('lbx').onclick=()=>{document.getElementById('lb').classList.remove('on');document.body.style.overflow=''};
const sm=u=>u.includes('zillowstatic')?u+'-se_medium_500_250.webp':u, big=u=>u.includes('zillowstatic')?u+'-se_extra_large_1500_800.webp':u;
let edit=false,lastDel=null;
function setEdit(v){edit=v;document.body.classList.toggle('edit',v);if(v&&navigator.vibrate)navigator.vibrate(15);render()}
document.getElementById('done').onclick=()=>setEdit(false);
document.getElementById('undo').onclick=()=>{if(!lastDel)return;const {id,wasStar,pos}=lastDel;S.hidden=(S.hidden||[]).filter(x=>x!==id);if(wasStar){S.stars.splice(Math.max(0,pos),0,id)}push();render();document.getElementById('toast').classList.remove('on');lastDel=null};
(()=>{let tm=null,sx=0,sy=0;const L=document.getElementById('list');
 const start=e=>{if(edit)return;const c=e.target.closest('.card');if(!c||e.target.closest('a,button,.strip'))return;const p=e.touches?e.touches[0]:e;sx=p.clientX;sy=p.clientY;clearTimeout(tm);tm=setTimeout(()=>{tm=null;setEdit(true)},450)};
 const move=e=>{if(!tm)return;const p=e.touches?e.touches[0]:e;if(Math.abs(p.clientX-sx)>8||Math.abs(p.clientY-sy)>8){clearTimeout(tm);tm=null}};
 const end=()=>{clearTimeout(tm);tm=null};
 L.addEventListener('touchstart',start,{passive:true});L.addEventListener('touchmove',move,{passive:true});L.addEventListener('touchend',end);L.addEventListener('touchcancel',end);
 L.addEventListener('mousedown',start);L.addEventListener('mousemove',move);L.addEventListener('mouseup',end);
 L.addEventListener('contextmenu',e=>{if(e.target.closest('.card'))e.preventDefault()});})();
render();pull();setInterval(pull,5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
</script></body></html>

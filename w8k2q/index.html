 const rs=document.getElementById('rs');if(rs)rs.onclick=()=>{if(!confirm('Reset this list order for both of you?'))return;if(tab==='top')S.stars=defStars();else delete S.orders[tab];push();render()};
 el.querySelectorAll('[data-star]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=+b.dataset.star;S.stars=S.stars.includes(id)?S.stars.filter(x=>x!==id):[...S.stars,id];push();render()});
 if(window.srt){window.srt.destroy();window.srt=null}
 if(sort==='mine'&&L.length>1&&window.Sortable)window.srt=Sortable.create(el,{animation:150,delay:280,delayOnTouchOnly:true,touchStartThreshold:8,ghostClass:'ghost',chosenClass:'chosen',filter:'a,button',preventOnFilter:false,
  onStart:()=>dragging=true,onEnd:()=>{dragging=false;const ids=[...el.querySelectorAll('.card')].map(c=>+c.dataset.id);if(tab==='top')S.stars=ids;else S.orders[tab]=ids;push();render()}});}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b));render();scrollTo(0,0)});
document.querySelectorAll('.sorts button').forEach(b=>b.onclick=()=>{sort=b.dataset.s;document.querySelectorAll('.sorts button').forEach(x=>x.classList.toggle('on',x===b));render()});
render();pull();setInterval(pull,5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
</script></body></html>

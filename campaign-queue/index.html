<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Campaign Queue · Atrios</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#07130f;--panel:#0d1f19;--panel2:#11281f;--line:rgba(201,169,110,.16);--gold:#c9a96e;--gold2:#e8cf8c;--cream:#f4ead2;--mut:#8fa197;--ok:#4fd18b;--warn:#f0b35a;--bad:#ff6b6b}
*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(1200px 600px at 10% -10%,#173a2f 0,transparent 60%),radial-gradient(900px 500px at 110% 10%,#2a2412 0,transparent 55%),var(--bg);color:var(--cream);font:14px/1.5 Inter,sans-serif;min-height:100vh}
.wrap{max-width:1280px;margin:0 auto;padding:28px 24px 64px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
h1{font:700 40px/1 'Cormorant Garamond',serif;margin:0;background:linear-gradient(90deg,var(--cream),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.live{display:flex;align-items:center;gap:8px;font:500 12px 'JetBrains Mono',monospace;color:var(--mut);border:1px solid var(--line);padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.02)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(79,209,139,.55)}70%{box-shadow:0 0 0 10px rgba(79,209,139,0)}100%{box-shadow:0 0 0 0 rgba(79,209,139,0)}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:16px 18px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-30px;bottom:-60px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(201,169,110,.14),transparent 70%)}
.kpi .l{font:600 11px Inter;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.kpi .v{font:700 34px/1.1 Inter;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--mut);font-size:12px;margin-top:2px}
.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
@media(max-width:980px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:18px}
.card h2{font:600 12px Inter;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:0 0 14px;display:flex;justify-content:space-between;align-items:center}
.card h2 span{color:var(--mut);letter-spacing:.04em;text-transform:none;font-weight:500}
.senders{display:grid;grid-template-columns:1fr;gap:12px}
.sender{border:1px solid var(--line);border-radius:14px;padding:14px;background:rgba(0,0,0,.18);display:grid;grid-template-columns:78px 1fr;gap:14px;align-items:center}
.ring{width:78px;height:78px}.ring .t{font:700 18px Inter;fill:#f4ead2}.ring .u{font:600 8px Inter;fill:#8fa197;letter-spacing:.1em}
.sname{font-weight:600;font-size:15px}.badge{display:inline-block;font:600 10px Inter;letter-spacing:.08em;padding:3px 8px;border-radius:999px;margin-left:6px;vertical-align:2px}
.b-ok{background:rgba(79,209,139,.14);color:var(--ok)}.b-warn{background:rgba(240,179,90,.14);color:var(--warn)}.b-bad{background:rgba(255,107,107,.14);color:var(--bad)}
.stats{display:flex;gap:14px;margin-top:6px;font-size:12px;color:var(--mut)}.stats b{color:var(--cream);font-variant-numeric:tabular-nums}
.spark{margin-top:8px;height:26px;width:100%;display:block}
.camps{margin-top:6px;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:grid;grid-template-columns:20px 34px 1fr auto;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:rgba(0,0,0,.18);transition:transform .15s,border-color .15s}
.row:hover{border-color:rgba(201,169,110,.45);transform:translateY(-1px)}
.row.drag{opacity:.35}.row.over{border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,169,110,.25)}
.handle{cursor:grab;color:#5f7268;font-size:18px;text-align:center;user-select:none}
.n{font:700 22px 'Cormorant Garamond',serif;color:var(--gold);text-align:center}
.t{font-weight:600;font-size:15px}.m{color:var(--mut);font-size:12px;margin-top:2px}.m a{color:var(--gold2);text-decoration:none}
.pill{font:600 10px Inter;letter-spacing:.08em;padding:4px 8px;border-radius:999px;margin-left:8px;vertical-align:2px}
.Queued{background:rgba(201,169,110,.14);color:var(--gold2)}.Live{background:rgba(79,209,139,.14);color:var(--ok)}.Done{background:rgba(255,255,255,.07);color:var(--mut)}.Paused{background:rgba(255,107,107,.12);color:var(--bad)}
.wait{color:var(--warn);font-size:12px;margin-top:3px}.err{color:var(--bad);font-size:12px;margin-top:3px}
.acts{display:flex;gap:6px}.acts button{background:transparent;border:1px solid var(--line);color:var(--cream);border-radius:9px;padding:6px 10px;cursor:pointer;font:500 12px Inter}.acts button:hover{border-color:var(--gold);color:var(--gold2)}
.empty{color:var(--mut);padding:22px;text-align:center;border:1px dashed var(--line);border-radius:14px}
.log div{display:flex;gap:10px;font-size:12px;padding:8px 0;border-bottom:1px solid rgba(201,169,110,.08)}.log b{font:500 11px 'JetBrains Mono',monospace;color:var(--mut);min-width:150px;font-weight:500}
.stack{display:grid;gap:18px;align-content:start}
#gate{max-width:360px;margin:20vh auto;text-align:center}#gate input{padding:12px;border:1px solid var(--line);border-radius:12px;width:100%;background:var(--panel);color:var(--cream);font:inherit}
.eyebrow{font:600 11px Inter;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
</style></head><body>
<div id="gate"><div class="eyebrow">Campaign Queue</div><p style="color:#8fa197">Enter the Ace Inbox passcode</p><input id="pc" type="password" autofocus></div>
<div id="app" class="wrap" hidden>
 <div class="top"><h1>Campaign Queue</h1><div class="live"><span class="dot"></span><span id="upd">live</span></div></div>
 <div class="kpis">
  <div class="kpi"><div class="l">Up next</div><div class="v" id="k1">0</div><div class="s">queued campaigns</div></div>
  <div class="kpi"><div class="l">Live</div><div class="v" id="k2">0</div><div class="s">launched from the queue</div></div>
  <div class="kpi"><div class="l">Senders with room</div><div class="v" id="k3">–</div><div class="s" id="k3s"></div></div>
  <div class="kpi"><div class="l">Sends waiting</div><div class="v" id="k4">–</div><div class="s">queued + staged, all senders</div></div>
 </div>
 <div class="grid">
  <div class="stack">
   <div class="card"><h2>Up next <span>drag to reorder</span></h2><div id="q"></div></div>
   <div class="card"><h2>Live</h2><div id="live"></div></div>
   <div class="card"><h2>Done</h2><div id="done"></div></div>
  </div>
  <div class="stack">
   <div class="card"><h2>Capacity <span id="capat"></span></h2><div class="senders" id="cap"></div></div>
   <div class="card"><h2>Activity</h2><div class="log" id="log"></div></div>
  </div>
 </div>
</div>
<script>
const B={"s": "ElM+872V86Rp4JmeJL3xrw==", "i": "+MsacjeHAMrKvBVo", "c": "k8Ja1QglljOFH4txoJrlvC5+FVSeTnCCH8UIp/iRG9sJt8iVbvmiZMYmveOrGk4NQrRF21ukXg0oilTFDt3HleBq0tP39Ik5c2P9m+AwwYx9o0Yf0lxBChhIKScm1/2fNY88UOLuk+WyfVAPyabDYfhW3CG1OgzpagjYJ4F/A1UVXl1k3oDGG1ZWnrcFrgm5uBIAuw=="};const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));let C,DATA={items:[],log:[]};
async function unlock(p){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);
 const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d(B.s),iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 C=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:d(B.i)},k,d(B.c))));localStorage.cqk=p;
 document.getElementById('gate').remove();document.getElementById('app').hidden=false;await load();setInterval(load,30000);setInterval(ago,5000)}
document.getElementById('pc').addEventListener('keydown',e=>{if(e.key==='Enter')unlock(e.target.value).catch(()=>alert('Wrong passcode'))});
if(localStorage.cqk)unlock(localStorage.cqk).catch(()=>{});
const H=()=>({apikey:C.a,Authorization:'Bearer '+C.a,'Content-Type':'application/json'});
async function load(){const r=await fetch(C.u+'/rest/v1/shared_state?key=eq.'+C.k+'&select=data',{headers:H()});const j=await r.json();DATA=(j[0]&&j[0].data)||{items:[],log:[]};DATA.items=DATA.items||[];DATA.log=DATA.log||[];render()}
async function save(mut){await load();mut(DATA);const r=await fetch(C.u+'/rest/v1/shared_state?key=eq.'+C.k,{method:'PATCH',headers:Object.assign(H(),{Prefer:'return=minimal'}),body:JSON.stringify({data:DATA,updated_at:new Date().toISOString()})});if(!r.ok)alert('Save failed: '+r.status);render()}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now=()=>new Date().toLocaleString('en-US',{timeZone:'America/New_York',weekday:'short',month:'2-digit',day:'2-digit',hour:'numeric',minute:'2-digit'})+' ET';
function ago(){const c=DATA.capacity;if(!c||!c.iso)return;const m=Math.round((Date.now()-new Date(c.iso))/60000);document.getElementById('upd').textContent='Monaco checked '+(m<1?'just now':m<60?m+' min ago':Math.round(m/60)+'h ago')+' · checks every 2h'}
function ring(w,th){const max=Math.max(th*20,100),pct=Math.min(1,w/max),R=32,Cc=2*Math.PI*R,col=w<=th?'#4fd18b':w<=th*10?'#f0b35a':'#ff6b6b';
 return '<svg class="ring" viewBox="0 0 78 78"><circle cx="39" cy="39" r="'+R+'" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="7"/><circle cx="39" cy="39" r="'+R+'" fill="none" stroke="'+col+'" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+(Cc*Math.max(.02,pct)).toFixed(1)+' '+Cc.toFixed(1)+'" transform="rotate(-90 39 39)"/><text class="t" x="39" y="42" text-anchor="middle">'+w+'</text><text class="u" x="39" y="54" text-anchor="middle">WAITING</text></svg>'}
function spark(name){const h=(DATA.history||[]).map(x=>(x.w||{})[name]||0);if(h.length<2)return '<div class="camps">trend builds as checks run</div>';const mx=Math.max(...h,1),W=200,Hh=26;
 const pts=h.map((v,i)=>(i*(W/(h.length-1))).toFixed(1)+','+(Hh-2-(v/mx)*(Hh-4)).toFixed(1)).join(' ');
 return '<svg class="spark" viewBox="0 0 '+W+' '+Hh+'" preserveAspectRatio="none"><polyline points="'+pts+'" fill="none" stroke="#c9a96e" stroke-width="1.6"/></svg>'}
function row(it,i,q){const url='https://app.monaco.com/campaigns/'+it.campaign_id;const dr=q&&it.status=='Queued';
 return '<div class="row" '+(dr?'draggable="true"':'')+' data-id="'+it.id+'"><div class="handle">'+(dr?'⠿':'')+'</div><div class="n">'+(dr?i+1:'')+'</div>'+
 '<div><div class="t">'+esc(it.name)+'<span class="pill '+it.status+'">'+(it.status=='Paused'?'ON HOLD':it.status.toUpperCase())+'</span></div>'+
 '<div class="m">'+(it.vendor?esc(it.vendor)+' · ':'')+'built by '+esc(it.creator)+(it.size?' · '+esc(it.size)+' people':'')+' · <a href="'+url+'" target="_blank">Monaco ↗</a>'+(it.senders?' · '+esc(it.senders.join(', ')):'')+'</div>'+
 (it.waiting_on?'<div class="wait">Waiting for room on '+esc(it.waiting_on.join(', '))+'</div>':'')+(it.error?'<div class="err">'+esc(it.error)+'</div>':'')+
 '<div class="m">'+(it.status=='Live'?'Launched '+esc(it.live_at):it.status=='Done'?'Finished '+esc(it.done_at):'Added '+esc(it.added_at))+'</div></div>'+
 '<div class="acts">'+(it.status=='Queued'?'<button onclick="top1(\''+it.id+'\')">↑ Top</button><button onclick="hold(\''+it.id+'\')">Hold</button>':'')+(it.status=='Paused'?'<button onclick="requeue(\''+it.id+'\')">Re-queue</button>':'')+'</div></div>'}
function render(){const q=DATA.items.filter(x=>x.status=='Queued'||x.status=='Paused');let n=0;
 document.getElementById('q').innerHTML=q.length?q.map(x=>row(x,x.status=='Queued'?n++:0,true)).join(''):'<div class="empty">Nothing queued yet. Campaigns land here as Ace builds them with you.</div>';
 const L=DATA.items.filter(x=>x.status=='Live'),D=DATA.items.filter(x=>x.status=='Done');
 document.getElementById('live').innerHTML=L.length?L.map(x=>row(x,0,false)).join(''):'<div class="empty">Nothing launched from the queue yet.</div>';
 document.getElementById('done').innerHTML=D.length?D.map(x=>row(x,0,false)).join(''):'<div class="empty">None yet.</div>';
 document.getElementById('k1').textContent=DATA.items.filter(x=>x.status=='Queued').length;document.getElementById('k2').textContent=L.length;
 const cap=DATA.capacity;if(cap){const S=Object.values(cap.senders).sort((a,b)=>(a.name||'').localeCompare(b.name||''));const th=cap.thresh;
  document.getElementById('k3').textContent=S.filter(s=>s.room).length+' / '+S.length;document.getElementById('k3s').textContent=S.filter(s=>s.room).map(s=>(s.name||'').split(' ')[0]).join(', ')||'none right now';
  document.getElementById('k4').textContent=S.reduce((a,s)=>a+s.waiting,0);document.getElementById('capat').textContent='room = '+th+' or fewer waiting';
  document.getElementById('cap').innerHTML=S.map(s=>{const b=s.waiting<=th?'<span class="badge b-ok">ROOM</span>':s.waiting<=th*10?'<span class="badge b-warn">FILLING</span>':'<span class="badge b-bad">FULL</span>';const cs=s.campaigns||[];
   return '<div class="sender">'+ring(s.waiting,th)+'<div><div class="sname">'+esc(s.name)+b+'</div><div class="stats"><span><b>'+(s.queued||0)+'</b> queued</span><span><b>'+(s.staged||0)+'</b> staged</span><span><b>'+(s.in_flight||0)+'</b> in flight</span></div>'+spark(s.name)+'<div class="camps" title="'+esc(cs.join(' · '))+'">'+cs.length+' active campaign'+(cs.length==1?'':'s')+(cs.length?': '+esc(cs.join(' · ')):'')+'</div></div></div>'}).join('');ago()}
 document.getElementById('log').innerHTML=DATA.log.slice(0,14).map(l=>'<div><b>'+esc(l.at)+'</b><span>'+esc(l.msg)+'</span></div>').join('')||'<div style="color:#8fa197">No activity yet.</div>';dnd()}
function dnd(){let src=null;document.querySelectorAll('#q .row[draggable]').forEach(el=>{
 el.ondragstart=e=>{src=el;el.classList.add('drag');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',el.dataset.id)};
 el.ondragend=()=>{el.classList.remove('drag');document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'))};
 el.ondragover=e=>{e.preventDefault();el.classList.add('over')};el.ondragleave=()=>el.classList.remove('over');
 el.ondrop=e=>{e.preventDefault();if(!src||src===el)return;const a=src.dataset.id,b=el.dataset.id;save(D=>{const i=D.items.findIndex(x=>x.id==a);const m=D.items.splice(i,1)[0];const j=D.items.findIndex(x=>x.id==b);D.items.splice(j,0,m);D.log.unshift({at:now(),msg:'Reordered: '+m.name})})}})}
function top1(id){save(D=>{const i=D.items.findIndex(x=>x.id==id);const m=D.items.splice(i,1)[0];D.items.unshift(m);D.log.unshift({at:now(),msg:'Moved to top: '+m.name})})}
function hold(id){save(D=>{const m=D.items.find(x=>x.id==id);m.status='Paused';D.log.unshift({at:now(),msg:'On hold: '+m.name})})}
function requeue(id){save(D=>{const m=D.items.find(x=>x.id==id);m.status='Queued';D.log.unshift({at:now(),msg:'Re-queued: '+m.name})})}
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Campaign Queue · Atrios</title>
<style>
@font-face{font-family:Aspekta;src:url(AspektaVF.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:AtriosSerif;src:url(AtriosSerifLatin-Regular.woff2) format('woff2');font-weight:400}
@font-face{font-family:AtriosSerif;src:url(AtriosSerifLatin-Bold.woff2) format('woff2');font-weight:700}
:root{--primary:#0E2723;--primary-light:#05483A;--dark:#0A1A17;--gold:#C9A96E;--gold-border:#A07842;--gold-text:#6B4E1F;--cream:#FFF4DE;--paper:#FAF8F5;--base:#221D1B;--secondary:#4A4A4A;--muted:#757575;--border:#E8DFC8;--surface:#F5F5F5;--ok:#1A4D36;--warn:#9A6B12;--bad:#981B1B}
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--base);font:400 15px/1.5 Aspekta,system-ui,sans-serif}
.hero{background:linear-gradient(135deg,#0E2723 0%,#0A1A17 100%);color:var(--cream);padding:28px 0 76px}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font:700 44px/1.1 AtriosSerif,'Nanum Myeongjo',serif;margin:0;color:var(--cream)}
.live{display:flex;align-items:center;gap:8px;font:500 12px Aspekta;color:var(--cream);border:1px solid rgba(201,169,110,.45);padding:7px 12px;border-radius:999px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gold);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(201,169,110,.6)}70%{box-shadow:0 0 0 10px rgba(201,169,110,0)}100%{box-shadow:0 0 0 0 rgba(201,169,110,0)}}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:-52px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 18px;box-shadow:0 10px 15px -3px rgba(0,0,0,.1)}
.kpi .l{font:500 12px Aspekta;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-text)}
.kpi .v{font:700 36px/1.15 AtriosSerif,serif;color:var(--primary);margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;margin:18px 0 48px}
@media(max-width:960px){.grid{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stack{display:grid;gap:18px;align-content:start;min-width:0}
.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px;box-shadow:0 1px 2px rgba(0,0,0,.05);min-width:0}
.card h2{font:600 22px/1.1 AtriosSerif,serif;color:var(--primary);margin:0 0 14px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card h2 span{font:400 13px Aspekta;color:var(--muted)}
.senders{display:grid;gap:12px}
.sender{border:1px solid var(--border);border-radius:12px;padding:14px;display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;align-items:center;background:var(--paper)}
.ring{width:72px;height:72px}.ring .t{font:700 18px Aspekta;fill:#0E2723}.ring .u{font:500 8px Aspekta;fill:#757575;letter-spacing:.1em}
.sname{font-weight:600;font-size:16px;color:var(--primary)}
.badge{display:inline-block;font:500 11px Aspekta;padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:2px;border:1px solid}
.b-ok{color:var(--ok);background:rgba(26,77,54,.1);border-color:rgba(26,77,54,.25)}.b-warn{color:var(--warn);background:rgba(201,169,110,.15);border-color:var(--gold-border)}.b-bad{color:var(--bad);background:rgba(152,27,27,.08);border-color:rgba(152,27,27,.25)}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:4px;font-size:13px;color:var(--muted)}.stats b{color:var(--base);font-variant-numeric:tabular-nums}
.bars{margin-top:8px;display:grid;gap:4px}.bar{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12px;color:var(--muted)}.bar .bg{height:6px;background:#EFE8D6;border-radius:99px;overflow:hidden}.bar .bg i{display:block;height:100%;background:var(--gold-border);border-radius:99px}.bar .bt b{color:var(--base)}.ln{font-size:11px;color:var(--muted)}
.spark{margin-top:8px;height:24px;width:100%;display:block}
.camps{margin-top:6px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:grid;grid-template-columns:18px 30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px;border:1px solid var(--border);border-radius:12px;margin-bottom:10px;background:#fff;transition:box-shadow .15s,border-color .15s}
.row:hover{border-color:var(--gold);box-shadow:0 10px 15px -3px rgba(0,0,0,.08)}
.row.drag{opacity:.4}.row.over{border-color:var(--gold-border);box-shadow:0 0 0 3px rgba(201,169,110,.25)}
.handle{cursor:grab;color:#B8AE97;font-size:18px;text-align:center;user-select:none}
.n{font:700 22px AtriosSerif,serif;color:var(--gold-border);text-align:center}
.t{font-weight:600;font-size:15px;color:var(--primary)}.m{color:var(--muted);font-size:13px;margin-top:2px}.m a{color:var(--primary-light)}
.pill{font:500 11px Aspekta;padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:2px;border:1px solid var(--border)}
.Queued{background:rgba(201,169,110,.12);color:var(--gold-text)}.Live{background:rgba(26,77,54,.1);color:var(--ok)}.Done{background:var(--surface);color:var(--secondary)}.Paused{background:rgba(152,27,27,.08);color:var(--bad)}
.wait{color:var(--warn);font-size:13px;margin-top:3px}.err{color:var(--bad);font-size:13px;margin-top:3px}
.acts{display:flex;gap:6px}.acts button{background:#fff;border:1px solid var(--border);color:var(--primary);border-radius:12px;padding:6px 12px;cursor:pointer;font:400 13px Aspekta}.acts button:hover{border-color:var(--gold)}
.empty{color:var(--muted);padding:20px;text-align:center;border:1px dashed var(--border);border-radius:12px;background:var(--paper);font-size:14px}
.log div{display:flex;gap:12px;font-size:13px;padding:8px 0;border-bottom:1px solid var(--border)}.log b{font-weight:500;color:var(--muted);min-width:140px}
#gate{max-width:360px;margin:20vh auto;text-align:center}#gate input{padding:10px 14px;border:1px solid var(--border);border-radius:12px;width:100%;font:inherit;background:#fff}
.eyebrow{font:500 12px Aspekta;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-text)}
.capcard{margin-top:18px}.tw{overflow-x:auto}.ct{width:100%;border-collapse:collapse;font-size:14px}.ct th{text-align:left;font:500 11px Aspekta;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-text);padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}.ct td{padding:12px 10px;border-bottom:1px solid var(--border);vertical-align:middle}.ct tr:last-child td{border-bottom:0}.ct .nm{font-weight:600;color:var(--primary);white-space:nowrap}.ct .num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}.ct .cm{color:var(--muted);font-size:12px;max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ct .pb{min-width:150px}.ct .bar{grid-template-columns:minmax(60px,1fr) auto}.ct tfoot td{font-weight:600;color:var(--primary);border-top:1px solid var(--gold-border)}
</style></head><body>
<div id="gate"><div class="eyebrow">Campaign Queue</div><p style="color:#757575">Enter the Ace Inbox passcode</p><input id="pc" type="password" autofocus></div>
<div id="app" hidden>
 <div class="hero"><div class="wrap"><div class="top"><h1>Campaign Queue</h1><div class="live"><span class="dot"></span><span id="upd">live</span></div></div></div></div>
 <div class="wrap"><div class="kpis">
  <div class="kpi"><div class="l">Up next</div><div class="v" id="k1">0</div><div class="s">queued campaigns</div></div>
  <div class="kpi"><div class="l">Live</div><div class="v" id="k2">0</div><div class="s">launched from the queue</div></div>
  <div class="kpi"><div class="l">Senders with room</div><div class="v" id="k3">–</div><div class="s" id="k3s"></div></div>
  <div class="kpi"><div class="l">Sent today</div><div class="v" id="k4">–</div><div class="s" id="k4s">emails + LinkedIn, all senders</div></div>
 </div>
 <div class="card capcard"><h2>Capacity today <span id="capat"></span></h2><div class="tw"><table class="ct" id="cap"></table></div></div>
 <div class="grid">
  <div class="stack">
   <div class="card"><h2>Campaign queue <span>drag to reorder</span></h2><div id="q"></div></div>
   <div class="card"><h2>Live</h2><div id="live"></div></div>
  </div>
  <div class="stack">
   <div class="card"><h2>Done</h2><div id="done"></div></div>
   <div class="card"><h2>Activity</h2><div class="log" id="log"></div></div>
  </div>
 </div></div>
</div>
<script>
const B={"s": "pH56uxWS5k5RU1b0F+uH+w==", "i": "92QdsDoX5AD3nK86", "c": "upRwSbACiRaqf3HOkQ7ViLT3jPkOQP/26wvn6h+PdEVUI3RD/s/BXIRBKftShCO7XGtYW9m9GZeiNqvjzwQmhxkMkIKgp9SxnGz4sX2uYgCPHMFJf+7UCSF2oaJs7Sn0TJ+hu9n9z3S8ym54EjtqdSDcLRMB5xi67962o2CCRvoLmLJTeEGSKKnuO5yM1ZnciR5iWA=="};const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));let C,DATA={items:[],log:[]};
async function unlock(p){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);
 const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d(B.s),iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 C=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:d(B.i)},k,d(B.c))));localStorage.cqk=p;
 document.getElementById('gate').remove();document.getElementById('app').hidden=false;await load();setInterval(load,30000);setInterval(ago,5000)}
document.getElementById('pc').addEventListener('keydown',e=>{if(e.key==='Enter')unlock(e.target.value).catch(()=>alert('Wrong passcode'))});
if(localStorage.cqk)unlock(localStorage.cqk).catch(()=>{});
const H=()=>({apikey:C.a,Authorization:'Bearer '+C.a,'Content-Type':'application/json'});
async function load(){const r=await fetch(C.u+'/rest/v1/shared_state?key=eq.'+C.k+'&select=data',{headers:H()});const j=await r.json();DATA=(j[0]&&j[0].data)||{items:[],log:[]};DATA.items=DATA.items||[];DATA.log=DATA.log||[];render()}
async function save(mut){await load();mut(DATA);const r=await fetch(C.u+'/rest/v1/shared_state?key=eq.'+C.k,{method:'PATCH',headers:Object.assign(H(),{Prefer:'return=minimal'}),body:JSON.stringify({data:DATA,updated_at:new Date().toISOString()})});if(!r.ok)alert('Save failed: '+r.status);render()}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now=()=>new Date().toLocaleString('en-US',{timeZone:'America/New_York',weekday:'short',month:'2-digit',day:'2-digit',hour:'numeric',minute:'2-digit'})+' ET';
function ago(){const c=DATA.capacity;if(!c||!c.iso)return;const m=Math.round((Date.now()-new Date(c.iso))/60000);document.getElementById('upd').textContent='Monaco checked '+(m<1?'just now':m<60?m+' min ago':Math.round(m/60)+'h ago')+' · checks every 2h'}
function bar(lbl,v,lim){if(!lim)return '<div class="bar"><span class="bl">'+lbl+'</span><span class="bt">'+(v||0)+' today · not sending yet</span></div>';const pct=Math.min(100,Math.round(100*(v||0)/lim));return '<div class="bar"><span class="bl">'+lbl+'</span><span class="bg"><i style="width:'+pct+'%"></i></span><span class="bt"><b>'+(v||0)+'</b> / '+lim+' today</span></div>'}
function bars(s){return '<div class="bars">'+bar('Email',s.sent_email,s.lim_email)+bar('LinkedIn',s.sent_li,s.lim_li)+(s.lim_note?'<div class="ln">'+esc(s.lim_note)+'</div>':'')+'</div>'}
function ring(w,th){const max=Math.max(th*20,100),pct=Math.min(1,w/max),R=30,Cc=2*Math.PI*R,col=w<=th?'#1A4D36':w<=th*10?'#C9A96E':'#981B1B';
 return '<svg class="ring" viewBox="0 0 72 72"><circle cx="36" cy="36" r="'+R+'" fill="none" stroke="#EFE8D6" stroke-width="7"/><circle cx="36" cy="36" r="'+R+'" fill="none" stroke="'+col+'" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+(Cc*Math.max(.02,pct)).toFixed(1)+' '+Cc.toFixed(1)+'" transform="rotate(-90 36 36)"/><text class="t" x="36" y="40" text-anchor="middle">'+w+'</text><text class="u" x="36" y="51" text-anchor="middle">WAITING</text></svg>'}
function spark(name){const h=(DATA.history||[]).map(x=>(x.w||{})[name]||0);if(h.length<2)return '<div class="camps">trend builds as checks run</div>';const mx=Math.max(...h,1),W=200,Hh=26;
 const pts=h.map((v,i)=>(i*(W/(h.length-1))).toFixed(1)+','+(Hh-2-(v/mx)*(Hh-4)).toFixed(1)).join(' ');
 return '<svg class="spark" viewBox="0 0 '+W+' '+Hh+'" preserveAspectRatio="none"><polyline points="'+pts+'" fill="none" stroke="#A07842" stroke-width="1.6"/></svg>'}
function row(it,i,q){const url='https://app.monaco.com/campaigns/'+it.campaign_id;const dr=q&&it.status=='Queued';
 return '<div class="row" '+(dr?'draggable="true"':'')+' data-id="'+it.id+'"><div class="handle">'+(dr?'⠿':'')+'</div><div class="n">'+(dr?i+1:'')+'</div>'+
 '<div><div class="t">'+esc(it.name)+'<span class="pill '+it.status+'">'+(it.status=='Paused'?'ON HOLD':it.status.toUpperCase())+'</span></div>'+
 '<div class="m">'+(it.vendor?esc(it.vendor)+' · ':'')+'built by '+esc(it.creator)+(it.size?' · '+esc(it.size)+' people':'')+' · <a href="'+url+'" target="_blank">Monaco ↗</a>'+(it.senders?' · '+esc(it.senders.join(', ')):'')+'</div>'+
 (it.waiting_on?'<div class="wait">Waiting for room on '+esc(it.waiting_on.join(', '))+'</div>':'')+(it.error?'<div class="err">'+esc(it.error)+'</div>':'')+
 '<div class="m">'+(it.status=='Live'?'Launched '+esc(it.live_at):it.status=='Done'?'Finished '+esc(it.done_at):'Added '+esc(it.added_at))+'</div></div>'+
 '<div class="acts">'+(it.status=='Queued'?'<button onclick="top1(\''+it.id+'\')">↑ Top</button><button onclick="hold(\''+it.id+'\')">Hold</button>':'')+(it.status=='Paused'?'<button onclick="requeue(\''+it.id+'\')">Re-queue</button>':'')+'</div></div>'}
function render(){const q=DATA.items.filter(x=>x.status=='Queued'||x.status=='Paused');let n=0;
 document.getElementById('q').innerHTML=q.length?q.map(x=>row(x,x.status=='Queued'?n++:0,true)).join(''):'<div class="empty">Nothing queued yet. Campaigns land here as Ace builds them with you.</div>';
 const L=DATA.items.filter(x=>x.status=='Live'),D=DATA.items.filter(x=>x.status=='Done');
 document.getElementById('live').innerHTML=L.length?L.map(x=>row(x,0,false)).join(''):'<div class="empty">Nothing launched from the queue yet.</div>';
 document.getElementById('done').innerHTML=D.length?D.map(x=>row(x,0,false)).join(''):'<div class="empty">None yet.</div>';
 document.getElementById('k1').textContent=DATA.items.filter(x=>x.status=='Queued').length;document.getElementById('k2').textContent=L.length;
 const cap=DATA.capacity;if(cap){const S=Object.values(cap.senders).sort((a,b)=>(a.name||'').localeCompare(b.name||''));const th=cap.thresh;
  document.getElementById('k3').textContent=S.filter(s=>s.room).length+' / '+S.length;document.getElementById('k3s').textContent=S.filter(s=>s.room).map(s=>(s.name||'').split(' ')[0]).join(', ')||'none right now';
  const se=S.reduce((a,s)=>a+(s.sent_email||0)+(s.sent_li||0),0),le=S.reduce((a,s)=>a+(s.lim_email||0)+(s.lim_li||0),0);document.getElementById('k4').textContent=se+' / '+le;document.getElementById('k4s').textContent=S.reduce((a,s)=>a+s.waiting,0)+' sequences waiting to send';document.getElementById('capat').textContent='room = '+th+' or fewer waiting';
  const pb=(v,l)=>!l?'<span class="ln">not sending yet</span>':'<div class="bar"><span class="bg"><i style="width:'+Math.min(100,Math.round(100*(v||0)/l))+'%"></i></span><span class="bt"><b>'+(v||0)+'</b> / '+l+'</span></div>';
  const badge=s=>!s.lim_email?'<span class="badge b-warn">WARMING</span>':s.waiting<=th?'<span class="badge b-ok">ROOM</span>':s.waiting<=th*10?'<span class="badge b-warn">FILLING</span>':'<span class="badge b-bad">FULL</span>';
  const T=k=>S.reduce((a,s)=>a+(s[k]||0),0);
  document.getElementById('cap').innerHTML='<thead><tr><th>Sender</th><th>Status</th><th>Email today / limit</th><th>LinkedIn today / limit</th><th class="num">Queued</th><th class="num">Staged</th><th class="num">In flight</th><th>Active campaigns</th></tr></thead><tbody>'+
   S.map(s=>{const cs=s.campaigns||[];return '<tr><td class="nm">'+esc(s.name)+'<div class="ln">'+esc(s.lim_note||'')+'</div></td><td>'+badge(s)+'</td><td class="pb">'+pb(s.sent_email,s.lim_email)+'</td><td class="pb">'+pb(s.sent_li,s.lim_li)+'</td><td class="num">'+(s.queued||0)+'</td><td class="num">'+(s.staged||0)+'</td><td class="num">'+(s.in_flight||0)+'</td><td class="cm" title="'+esc(cs.join(' · '))+'">'+cs.length+(cs.length?': '+esc(cs.join(' · ')):'')+'</td></tr>'}).join('')+
   '</tbody><tfoot><tr><td>Team</td><td></td><td>'+T('sent_email')+' / '+T('lim_email')+'</td><td>'+T('sent_li')+' / '+T('lim_li')+'</td><td class="num">'+T('queued')+'</td><td class="num">'+T('staged')+'</td><td class="num">'+T('in_flight')+'</td><td></td></tr></tfoot>';ago()}
 document.getElementById('log').innerHTML=DATA.log.slice(0,14).map(l=>'<div><b>'+esc(l.at)+'</b><span>'+esc(l.msg)+'</span></div>').join('')||'<div style="color:#757575">No activity yet.</div>';dnd()}
function dnd(){let src=null;document.querySelectorAll('#q .row[draggable]').forEach(el=>{
 el.ondragstart=e=>{src=el;el.classList.add('drag');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',el.dataset.id)};
 el.ondragend=()=>{el.classList.remove('drag');document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'))};
 el.ondragover=e=>{e.preventDefault();el.classList.add('over')};el.ondragleave=()=>el.classList.remove('over');
 el.ondrop=e=>{e.preventDefault();if(!src||src===el)return;const a=src.dataset.id,b=el.dataset.id;save(D=>{const i=D.items.findIndex(x=>x.id==a);const m=D.items.splice(i,1)[0];const j=D.items.findIndex(x=>x.id==b);D.items.splice(j,0,m);D.log.unshift({at:now(),msg:'Reordered: '+m.name})})}})}
function top1(id){save(D=>{const i=D.items.findIndex(x=>x.id==id);const m=D.items.splice(i,1)[0];D.items.unshift(m);D.log.unshift({at:now(),msg:'Moved to top: '+m.name})})}
function hold(id){save(D=>{const m=D.items.find(x=>x.id==id);m.status='Paused';D.log.unshift({at:now(),msg:'On hold: '+m.name})})}
function requeue(id){save(D=>{const m=D.items.find(x=>x.id==id);m.status='Queued';D.log.unshift({at:now(),msg:'Re-queued: '+m.name})})}
</script></body></html>
